<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="The System">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>The System</title>
<style>
:root{
  --void:#04060c; --panel:#080d18; --panel2:#0c1424; --line:#164e63;
  --cyan:#22d3ee; --cyanDim:#0e7490; --text:#c9d8e6; --mute:#5f7488;
  --green:#16a34a; --greenLit:#4ade80; --amber:#f59e0b; --red:#dc2626;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--void); color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.5; padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:16px 12px 0}
.mono{font-family:var(--mono)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyanDim)}
.hunter{font-family:var(--mono);font-size:18px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan)}
.rank{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;text-align:right}
.rank small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-top:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;margin-bottom:12px;
  box-shadow:inset 0 0 40px -34px var(--cyan)}
.panel.glow{box-shadow:0 0 24px -6px rgba(34,211,238,.33), inset 0 0 40px -30px var(--cyan)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
  border-bottom:1px solid var(--line);background:var(--panel2);
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.ph span.r{color:var(--mute);letter-spacing:.1em}
.pb{padding:12px}
.pb > * + *{margin-top:12px}

.bar{width:100%;background:#0f1b2b;border-radius:2px;overflow:hidden;height:6px}
.bar > i{display:block;height:100%;transition:width .5s}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:8px 12px}
.tile b{display:block;font-family:var(--mono);font-size:22px;font-weight:400}
.tile em{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-style:normal}
.muted{color:var(--mute)}
.amber{color:var(--amber)}
.green{color:var(--greenLit)}
.cy{color:var(--cyan)}
.small{font-size:13px;line-height:1.6}
.tiny{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--mute)}

button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:2px;
  background:var(--cyanDim);color:#04121a;border:1px solid var(--cyan);
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--cyan)}

.quest{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border-radius:2px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.quest.done{background:#07210f;border-color:var(--green)}
.tick{width:22px;height:22px;flex:0 0 22px;border:1px solid var(--cyanDim);color:transparent;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px}
.quest.done .tick{border-color:var(--greenLit);color:var(--greenLit)}
.quest .lbl{flex:1}
.quest .lbl b{display:block;font-weight:400;font-size:15px}
.quest.done .lbl b{color:var(--greenLit);text-decoration:line-through}
.quest .lbl em{display:block;font-family:var(--mono);font-size:10px;color:var(--mute);font-style:normal;margin-top:2px}
.quest .xp{font-family:var(--mono);font-size:12px;color:var(--cyanDim)}

.acc{background:var(--panel2);border:1px solid var(--line);border-radius:2px;margin-bottom:8px}
.acc.open{border-color:var(--cyan)}
.acc > button{display:block;width:100%;padding:12px}
.acc .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.acc .plus{font-family:var(--mono);font-size:14px;color:var(--cyanDim)}
.acc .sub{font-family:var(--mono);font-size:12px;margin-top:4px;color:var(--greenLit)}
.acc .sub i{color:var(--mute);font-style:normal}
.acc .meta{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.acc .body{padding:0 12px 12px}
.acc .body > * + *{margin-top:12px}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
ol.steps{margin:0;padding:0;list-style:none}
ol.steps li{display:flex;gap:8px;font-size:15px;line-height:1.6;margin-bottom:8px}
ol.steps li em{font-family:var(--mono);font-size:12px;color:var(--cyanDim);font-style:normal;flex:0 0 14px}
ul.dash{margin:0;padding:0;list-style:none}
ul.dash li{font-size:15px;line-height:1.6;margin-bottom:4px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:9px 12px;font-size:13px;line-height:1.6}
.note.good{background:#07210f;border-color:var(--green)}
.dayrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--panel2);font-size:15px}
.dayrow em{font-family:var(--mono);font-size:12px;color:var(--cyanDim);font-style:normal;flex:0 0 42px}
.hist{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--panel2);font-family:var(--mono);font-size:14px}

input,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:2px;padding:10px;font-family:var(--mono);font-size:15px;width:100%;outline:none}
textarea{font-family:var(--sans);resize:none}
input:focus,textarea:focus,button:focus-visible{border-color:var(--cyan);outline:2px solid rgba(34,211,238,.3);outline-offset:1px}
.weighrow{display:flex;gap:8px}
.weighrow input{width:70px}
.weighrow .btn{flex:1;width:auto}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;padding:13px 2px;text-align:center;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border-top:2px solid transparent}
nav button.on{color:var(--cyan);border-top-color:var(--cyan);background:var(--panel2)}

.overlay{position:fixed;inset:0;background:rgba(4,6,12,.88);display:flex;align-items:center;justify-content:center;padding:24px}
.overlay .panel{max-width:340px;width:100%;margin:0}
.lvl{font-family:var(--mono);font-size:60px;font-weight:700;color:var(--cyan);text-shadow:0 0 24px rgba(34,211,238,.55);line-height:1}
.center{text-align:center}

.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;background:var(--panel2);
  border:1px solid var(--line);border-radius:2px;padding:8px 12px;color:var(--text)}
.daynav button[disabled]{opacity:.35}
.result{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--panel2);margin-top:8px}
.result .rn{font-size:15px;line-height:1.3}
.result .ru{display:block;font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:2px}
.result .rk{font-family:var(--mono);font-size:12px;color:var(--cyan);white-space:nowrap}
.fitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--panel2)}
.fitem:last-child{border-bottom:none}
.fitem .fn{flex:1;font-size:15px;line-height:1.3}
.fitem .fn em{display:block;font-family:var(--mono);font-size:10px;color:var(--mute);font-style:normal;margin-top:2px}
.fitem .fk{font-family:var(--mono);font-size:14px;min-width:48px;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:2px;background:var(--panel);
  text-align:center;font-family:var(--mono);font-size:14px;color:var(--cyan);line-height:26px}
.qty span{font-family:var(--mono);font-size:13px;min-width:14px;text-align:center}
.fdel{color:var(--red);font-family:var(--mono);font-size:16px;padding:0 4px}
.pb input + input{margin-top:0}
nav button{padding:13px 1px;font-size:9px;letter-spacing:.1em}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:2px;
  padding:8px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.chip b{color:var(--cyan);font-weight:400}
.chip.sel{border-color:var(--cyan);color:var(--cyan);background:#07222b}
.amt{border:1px solid var(--cyan);border-top:none;border-radius:0 0 2px 2px;background:var(--panel);padding:12px}
.fitemwrap{margin-top:8px}
.fitemwrap .result{margin-top:0}
.result .own{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--greenLit);border:1px solid var(--green);border-radius:2px;padding:1px 4px;margin-left:6px}
.flash{border:1px solid var(--green);background:#07210f;color:var(--greenLit);border-radius:2px;
  padding:9px 12px;margin-bottom:12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
#results{margin-top:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<script>
/* ============================== DATA ============================== */
var KEY = "hunter_system_v1";

var RANKS = [
  {min:1,r:"E",c:"#94a3b8"},{min:4,r:"D",c:"#4ade80"},{min:7,r:"C",c:"#22d3ee"},
  {min:11,r:"B",c:"#a78bfa"},{min:16,r:"A",c:"#f59e0b"},{min:23,r:"S",c:"#f43f5e"}
];

var EX = {
  worktopPress:{name:"Worktop press-up",works:"Chest, shoulders, back of the arms",
    how:["Stand about an arm's length from the kitchen worktop.",
      "Put both hands on the edge, a bit wider apart than your shoulders.",
      "Walk your feet backwards until your body is one straight line from your head to your heels. Squeeze your bum and tighten your stomach so your hips don't sag.",
      "Bend your elbows and lower your chest towards the worktop. Your elbows should point backwards at roughly 45 degrees, not straight out sideways.",
      "When your chest is close to the edge, push the worktop away and straighten your arms. That is one rep."],
    feel:"Working across your chest and the back of your upper arms. Not in your lower back \u2014 if you feel it there, your hips are sagging.",
    easier:"Stand more upright, or use a higher surface like a windowsill.",
    harder:"Walk your feet further back, or move down to a lower surface."},
  inclinePress:{name:"Incline press-up",works:"Chest, shoulders, back of the arms",
    how:["Same movement as the worktop press-up, but with your hands on something lower \u2014 the arm of the sofa, the third or fourth stair, a sturdy chair pushed against a wall.",
      "Hands slightly wider than your shoulders, body in one straight line, bum squeezed.",
      "Lower your chest to the surface under control \u2014 about two seconds down.",
      "Push back up until your arms are straight."],
    feel:"Harder than the worktop version because more of your bodyweight goes through your arms.",
    easier:"Go back up a step. Literally \u2014 use a higher stair.",
    harder:"Go down a step. The floor is the final version."},
  floorPress:{name:"Full press-up",works:"Chest, shoulders, back of the arms, stomach",
    how:["Hands on the floor slightly wider than your shoulders, fingers spread, arms straight.",
      "Legs out behind you, feet together or hip-width apart. Body in one straight line \u2014 head, hips and heels.",
      "Squeeze your bum and brace your stomach as if you're about to be prodded in the belly. This stops the sag.",
      "Lower until your chest is about a fist's height off the floor. Elbows back at 45 degrees.",
      "Push the floor away and straighten your arms."],
    feel:"Everything. This is the benchmark \u2014 the first full one is worth writing in the journal.",
    easier:"Knees on the floor, keeping the straight line from knees to head. Or go back to the incline version.",
    harder:"Slow the lowering to four seconds, or put your feet on a chair."},
  chairSquat:{name:"Chair squat",works:"Thighs, bum",
    how:["Stand in front of a dining chair, feet about shoulder-width apart, toes turned out very slightly.",
      "Hold your arms straight out in front of you for balance.",
      "Push your hips backwards first, as if reaching for the seat with your bum. Let your knees bend as you go.",
      "Keep your chest up and your heels flat on the floor.",
      "Touch the seat lightly \u2014 don't flop onto it \u2014 then stand up by pushing the floor away through your heels."],
    feel:"Front of the thighs and the bum. Knees should feel fine \u2014 if they ache, sit back further onto your heels.",
    easier:"Cushion on the chair so you're not going as low, and use the chair arms to help.",
    harder:"Lower seat, or pause for two seconds when you touch it."},
  bodyweightSquat:{name:"Bodyweight squat",works:"Thighs, bum",
    how:["Feet shoulder-width apart, toes turned out slightly, arms out in front.",
      "Hips back and down, chest up, weight through the middle of your feet.",
      "Go down until your thighs are somewhere near parallel with the floor \u2014 or as far as you can go without your heels lifting or your back rounding.",
      "Drive back up through your heels and stand tall, squeezing your bum at the top."],
    feel:"Thighs burning by the last few reps. That burn is the point.",
    easier:"Keep the chair behind you as a depth guide.",
    harder:"Hold a rucksack loaded with tins against your chest."},
  loadedSquat:{name:"Loaded squat",works:"Thighs, bum, stomach, upper back",
    how:["Load a rucksack with tins, bags of rice or bottles of water. Start around 5kg \u2014 that's five tins.",
      "Wear it on your front, hugged to your chest, or on your back with the straps pulled tight.",
      "Squat exactly as you would without it: hips back, chest up, heels down.",
      "The weight pulls you forwards. Fight it by keeping your chest tall."],
    feel:"Same as a bodyweight squat, but you'll be out of breath sooner.",
    easier:"Take a tin out. Small jumps are the right way to add weight.",
    harder:"Add a tin. One every couple of weeks, not every session."},
  gluteBridge:{name:"Glute bridge",works:"Bum, back of thighs, lower back",
    how:["Lie on your back on the floor, knees bent, both feet flat and hip-width apart.",
      "Bring your heels back so they're about a hand's length from your bum.",
      "Arms flat on the floor by your sides, palms down.",
      "Push through your heels and lift your hips until your body is a straight line from knees to shoulders.",
      "Squeeze your bum hard for one second at the top, then lower slowly \u2014 don't drop."],
    feel:"In your bum. If you mainly feel it in your lower back you're arching too far \u2014 lift a bit less and squeeze harder.",
    easier:"Smaller range. Even an inch counts on day one.",
    harder:"One leg at a time, with the other knee hugged to your chest."},
  hipHinge:{name:"Hip hinge (good morning)",works:"Back of the thighs, bum, lower back",
    how:["Feet hip-width apart, knees soft \u2014 not locked, not bent.",
      "Hold a loaded bag against your chest, or just cross your hands over your chest with no weight to start.",
      "Push your hips backwards as if closing a car door with your bum. Your chest travels down as your hips go back.",
      "Keep your back flat like a table top the whole way. This is the important bit.",
      "Stop when you feel a stretch down the back of your thighs \u2014 usually about halfway down.",
      "Drive your hips forwards to stand up and squeeze your bum at the top."],
    feel:"A stretch down the back of the thighs, then those muscles working to stand you back up.",
    easier:"No weight, smaller range, and do it side-on to a mirror so you can see your back stays flat.",
    harder:"Add weight to the bag. Never round your back to get lower."},
  splitSquat:{name:"Split squat",works:"One leg at a time \u2014 thighs, bum, balance",
    how:["Stand tall, then take a long step backwards with one foot. Your back heel stays off the floor.",
      "Rest one hand on a wall or chair back. There's no prize for wobbling.",
      "Most of your weight stays on the front foot.",
      "Lower straight down \u2014 not forwards \u2014 until your back knee is an inch or two off the floor. Front shin stays close to upright.",
      "Push through the front heel to stand. All the reps on one leg, then swap."],
    feel:"Front leg working hard, back leg mostly just balancing.",
    easier:"Shorter step, smaller range, both hands on a chair.",
    harder:"Back foot up on a low step or the edge of the sofa."},
  walkingLunge:{name:"Walking lunge",works:"Thighs, bum, balance",
    how:["Stand tall with a bit of clear floor \u2014 a hallway works.",
      "Step forward with one leg, long enough that your front shin stays upright as you lower.",
      "Lower until your back knee nearly touches the floor.",
      "Push through the front heel and bring your back foot through into the next step.",
      "Keep alternating until you've done the reps on each leg."],
    feel:"Legs burning and heart rate up. Half strength work, half cardio.",
    easier:"Stay on the spot \u2014 step forward, then step back to where you started.",
    harder:"Hold the loaded rucksack."},
  doorwayRow:{name:"Doorway row",works:"Upper back, biceps",
    how:["Stand facing an open doorway with one foot either side of the frame.",
      "Grip both sides of the frame at about chest height. Check it's solid first.",
      "Keeping your body dead straight and your heels planted, lean backwards until your arms are fully straight.",
      "Pull your chest towards the frame by driving your elbows back and squeezing your shoulder blades together, as if pinching a pencil between them.",
      "Lower yourself back out slowly \u2014 three seconds. The slow part is where the work is."],
    feel:"Between and across your shoulder blades. This is what stops all the pressing rounding your shoulders forwards.",
    easier:"Stand more upright so you're leaning back less.",
    harder:"Walk your feet further forwards so you're leaning back further."},
  tableRow:{name:"Under-table row",works:"Upper back, biceps",
    how:["Find a solid table and test it takes your weight before you trust it. A dining table, not a folding one.",
      "Lie on your back underneath with your chest roughly under the edge.",
      "Reach up and grip the edge, hands a bit wider than your shoulders.",
      "Body in a straight line, heels on the floor, pull your chest up towards the edge.",
      "Lower back down slowly until your arms are straight."],
    feel:"Much harder than the doorway row. Your upper back will let you know.",
    easier:"Bend your knees and put your feet flat \u2014 that takes weight off.",
    harder:"Straighten your legs and put your heels on a chair."},
  plank:{name:"Plank",works:"Stomach, lower back, shoulders",
    how:["Forearms flat on the floor, elbows directly under your shoulders, hands facing forwards.",
      "Knees on the floor to start, or toes if you can hold the line.",
      "Straight line from your ears through your hips to your knees or heels.",
      "Squeeze your bum and brace your stomach. Tuck your ribs down slightly so your lower back doesn't dip.",
      "Breathe normally. Hold for the time, then drop your knees and rest."],
    feel:"A deep shaking tiredness across the stomach. Stop when your hips sag, even if the time isn't up \u2014 a good 20 seconds beats a sloppy 45.",
    easier:"Knees down, or forearms up on the sofa seat.",
    harder:"Toes down, or lift one foot an inch off the floor for a few seconds at a time."},
  deadBug:{name:"Dead bug",works:"Deep stomach muscles, coordination",
    how:["Lie on your back. Arms straight up at the ceiling, knees bent and lifted so your shins are parallel with the floor.",
      "Press your lower back flat into the floor \u2014 no gap. Keep it there throughout.",
      "Slowly lower your right arm back over your head and straighten your left leg out towards the floor at the same time.",
      "Stop just before either touches, then bring them back to the start.",
      "Repeat with the other arm and leg. That's one rep each side."],
    feel:"Slow and controlled. If your lower back lifts off the floor, don't reach as far.",
    easier:"Move only the arms, or only the legs.",
    harder:"Slow it right down and go closer to the floor."},
  pikePress:{name:"Pike press-up",works:"Shoulders, upper chest, triceps",
    how:["Start in a press-up position with your hands under your shoulders.",
      "Walk your feet in towards your hands and push your hips up high, so your body makes an upside-down V. Head between your arms.",
      "Legs as straight as is comfortable, heels reaching down towards the floor.",
      "Bend your elbows and lower the top of your head towards the floor between your hands.",
      "Stop just before you touch, then press back up until your arms are straight."],
    feel:"Shoulders, hard. This is the closest you get to an overhead press without owning weights.",
    easier:"Hands on the third stair with your feet on the floor \u2014 far less weight through the shoulders.",
    harder:"Feet up on a low step so the angle is steeper."},
  declinePress:{name:"Decline press-up",works:"Chest, shoulders, triceps, stomach",
    how:["Hands on the floor slightly wider than your shoulders.",
      "Feet up on a chair or the edge of the sofa, so your body slopes down towards the floor.",
      "Straight line from heels to head. Bum squeezed, stomach braced \u2014 the slope makes it want to sag.",
      "Lower until your chest is a fist\u2019s height off the floor, elbows back at 45 degrees.",
      "Press back up and lock out."],
    feel:"More of your weight over your arms than a flat press-up. Expect your reps to drop \u2014 that\u2019s the exercise working.",
    easier:"Lower surface under your feet, or back to flat press-ups.",
    harder:"Higher surface, or slow the lowering to four seconds."},
  sitUp:{name:"Sit-up",works:"Stomach",
    how:["Lie on your back, knees bent, feet flat. Tuck your feet under the sofa if they lift.",
      "Cross your hands over your chest. Don't pull on your neck.",
      "Curl up one bit at a time \u2014 head, shoulders, then upper back \u2014 until your chest is near your knees.",
      "Lower back down under control. Don't flop."],
    feel:"Front of the stomach. Neck stays relaxed throughout.",
    easier:"Crunches \u2014 just lift your head and shoulders a few inches.",
    harder:"Arms crossed behind your head, or slow it down."}
};

var WARMUP = ["March on the spot briskly for 2 minutes, swinging your arms.",
  "10 arm circles forwards, 10 backwards.","10 hip circles each way, hands on hips.",
  "10 slow chair squats, no weight.","5 slow press-ups against a wall."];

var COOLDOWN = ["Doorway chest stretch \u2014 forearm on the frame, step through, 30 seconds each side.",
  "Quad stretch \u2014 hold a foot behind you, knees together, 30 seconds each leg.",
  "Hamstring stretch \u2014 heel on a step, lean forwards with a flat back, 30 seconds each leg.",
  "Child's pose on the floor \u2014 45 seconds, breathe out slowly."];

var PHASES = [

/* =========================== HELPERS ============================== */

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function needFor(l){ return 369 + (l-1)*123; }
function rankFor(l){ var r=RANKS[0]; for(var i=0;i<RANKS.length;i++){ if(l>=RANKS[i].min) r=RANKS[i]; } return r; }
function rankColour(letter){ for(var i=0;i<RANKS.length;i++){ if(RANKS[i].r===letter) return RANKS[i].c; } return RANKS[0].c; }
function lbsToSt(lbs){ var st=Math.floor(lbs/14), rem=Math.round(lbs-st*14);
  return rem===14 ? (st+1)+" st 0 lb" : st+" st "+rem+" lb"; }
function curWeek(){ return Math.max(1, Math.floor(daysBetween(S.startISO, today())/7)+1); }
function curPhase(){ var w=curWeek(); for(var i=0;i<PHASES.length;i++){ if(w>=PHASES[i].wk[0] && w<=PHASES[i].wk[1]) return PHASES[i]; } return PHASES[PHASES.length-1]; }
function doneToday(){ return S.log[today()] || []; }
function streak(){
  var n=0;
  for(var i=0;i<400;i++){
    var d=iso(new Date(Date.now()-i*86400000)); var c=S.log[d]||[];
    if(c.length>=4){ n++; } else if(i===0){ continue; } else { break; }
  }
  return n;
}
function currentLbs(){ return S.weights.length ? S.weights[S.weights.length-1].lbs : S.startLbs; }

/* ============================ RENDER ============================== */

function bar(pct,colour,h){
  pct = Math.max(0, Math.min(100, pct));
  return '<div class="bar" style="height:'+(h||6)+'px"><i style="width:'+pct+'%;background:'+colour+';box-shadow:0 0 10px '+colour+'"></i></div>';
}
function panel(title,body,opt){
  opt=opt||{};
  return '<div class="panel'+(opt.glow?" glow":"")+'"><div class="ph"><span>'+esc(title)+'</span>'+
    (opt.right?'<span class="r">'+esc(opt.right)+'</span>':'')+'</div><div class="pb">'+body+'</div></div>';
}

function spark(){
  if(S.weights.length<2) return '<div class="tiny">Two weigh-ins will draw the line here.</div>';
  var vals=S.weights.map(function(w){return w.lbs;});
  var min=Math.min.apply(null,vals.concat([S.targetLbs]))-2, max=Math.max.apply(null,vals)+2;
  var W=300,H=70, pts=[];
  for(var i=0;i<S.weights.length;i++){
    var x=(i/(S.weights.length-1))*W, y=H-((S.weights[i].lbs-min)/(max-min))*H;
    pts.push(x.toFixed(1)+","+y.toFixed(1));
  }
  var ty=H-((S.targetLbs-min)/(max-min))*H;
  var dots="";
  pts.forEach(function(p){ var a=p.split(","); dots+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="2.5" fill="#22d3ee"/>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:70px">'+
    '<line x1="0" y1="'+ty.toFixed(1)+'" x2="'+W+'" y2="'+ty.toFixed(1)+'" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 4"/>'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="#22d3ee" stroke-width="2"/>'+dots+'</svg>';
}

function viewTraining(){
  var ph=curPhase(), w=curWeek(), h="";

  h += panel("How to read the plan",
    '<div class="small"><p style="margin:0 0 10px"><b class="cy">A rep</b> is one single movement \u2014 going down and back up once. Short for repetition.</p>'+
    '<p style="margin:0 0 10px"><b class="cy">A set</b> is a batch of reps done back to back without stopping. Then you rest, then you do the next set.</p>'+
    '<p style="margin:0 0 10px" class="muted">So "3 sets of 5 reps, rest 90 seconds" means: 5 press-ups, sit down for a minute and a half, 5 more, rest again, 5 more, done. Fifteen press-ups in total, spread over about five minutes.</p>'+
    '<p style="margin:0 0 10px"><b class="cy">Rest</b> means properly rest. You should be able to talk in full sentences before the next set.</p>'+
    '<p style="margin:0 0 10px"><b class="cy">When to move up</b> \u2014 when you can finish every set with two reps still left in you, use the harder version listed on the exercise.</p>'+
    '<p style="margin:0" class="amber">Tap any exercise below for how to do it, what it should feel like, and what to do if it\u2019s too hard or too easy.</p></div>', {glow:true});

  var pb = '<div class="note" style="background:var(--panel2)"><span class="mono green" style="font-size:12px">RUNNING \u2014 '+esc(ph.cardio)+'</span></div>'+
    (ph.ladder ? '<div class="note" style="background:var(--panel2)"><span class="mono amber" style="font-size:12px">LADDER \u2014 '+esc(ph.ladder)+', on the non-running days</span></div>' : '')+
    '<div>'+
    '<div class="lab" style="color:var(--mute)">Your week</div>';
  ph.week.forEach(function(r){
    pb += '<div class="dayrow"><em>'+r[0]+'</em><span'+(r[1].indexOf("Rest")>-1?' class="muted"':'')+'>'+esc(r[1])+'</span></div>';
  });
  pb += '</div>';
  if(ph.harder) pb += '<div class="note good"><div class="lab" style="color:var(--greenLit)">What\u2019s harder than last week</div>'+esc(ph.harder)+'</div>';
  pb += '<div class="small amber">'+esc(ph.note)+'</div>';
  h += panel(ph.rank+"-rank \u00b7 "+ph.name, pb, {right:"Week "+w});

  h += panel("How it gets harder",
    '<div class="small"><p style="margin:0 0 10px">The plan steps up on its own every week \u2014 it works out which week you\u2019re in from the date you started, so you never have to decide when to push. Nine weeks, three runs a week, E-rank to A-rank. Couch to 5 km.</p>'+
    '<p style="margin:0 0 10px">Two things climb. <b class="cy">The run</b> goes from 60 seconds at a time in week one to 30 minutes unbroken by week nine, which is your 5 km. <b class="cy">The ladder</b> starts at 10 press-ups, 10 sit-ups and 10 squats and goes up by 10 every fortnight, until it is 50 of each.</p>'+
    '<p style="margin:0 0 10px">The ladder tracks the run. 1 km is 10 of each, 2 km is 20, and so on up to 50 of each when you are running 5 km. It happens on the days you are not running.</p>'+
    '<p style="margin:0 0 10px" class="muted">The number is a total for the session, not a set. 50 press-ups means 50 by the time you finish, in as many sets as it takes \u2014 ten sets of five is exactly the same 50 as five sets of ten, and it counts the same.</p>'+
    '<p style="margin:0 0 10px" class="muted">The version counts too. Worktop press-ups are still press-ups. If the floor is too much, do the whole 50 off the stairs and move down when you can. Same for sit-ups \u2014 if your lower back complains, do crunches instead and keep the number.</p>'+
    '<p style="margin:0" class="amber">Past week 9 the plan stops changing. Three runs of 30 minutes, three ladder days of 50, every week. That is the routine, and the routine is what shifts the weight.</p></div>');

  var wu='<ol class="steps">';
  WARMUP.forEach(function(s,i){ wu += '<li><em>'+(i+1)+'</em><span>'+esc(s)+'</span></li>'; });
  wu += '</ol><div class="tiny">Five minutes. Non-negotiable \u2014 it\u2019s most of your injury insurance.</div>';
  h += panel("Warm-up \u2014 every session", wu);

  h += panel("Eating and drinking around a run",
    '<div class="small"><p style="margin:0 0 10px" class="muted">Nothing here is complicated, and none of it is optional-supplement nonsense. At 5 km and under, timing matters and products don\u2019t.</p>'+

    '<div class="note"><div class="lab" style="color:var(--greenLit)">Before</div>'+
    '<p style="margin:0 0 8px">If you run first thing, go out on an empty stomach. Anything under 45 minutes doesn\u2019t need fuel \u2014 you have plenty on board already. Drink about 300 ml of water when you get up, roughly half a pint, then go. Not a full pint straight down or it will slosh.</p>'+
    '<p style="margin:0 0 8px">If you\u2019ve had a proper meal, leave 2 to 3 hours before running. A full stomach and running do not get on, and that is where the stitch comes from.</p>'+
    '<p style="margin:0 0 8px">If it\u2019s been 4 or 5 hours since you ate and you feel hollow, have something small and mostly carbohydrate about 45 minutes to an hour before: a banana, a slice of toast with jam or honey, or a couple of oatcakes. Low fat, low fibre, small.</p>'+

function fEntries(d){ return (S.food && S.food[d]) || []; }
function fKcal(d){ var t=0; fEntries(d).forEach(function(e){ t += e.k; }); return Math.round(t); }
function fProtein(d){ var t=0; fEntries(d).forEach(function(e){ t += (e.p||0); }); return Math.round(t); }
function shiftDay(d,n){ var x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return iso(x); }
function niceDay(d){
  if(d===today()) return "Today";
  if(d===shiftDay(today(),-1)) return "Yesterday";
  return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
function avg7(){
  var n=0,sum=0,d=today();
  for(var i=0;i<7;i++){ if(fEntries(d).length){ n++; sum+=fKcal(d); } d=shiftDay(d,-1); }
  return n ? Math.round(sum/n) : 0;
}
function allFoods(){
  var out=[], i;
  for(i=0;i<(S.customFoods||[]).length;i++) out.push({key:"c"+i, f:S.customFoods[i], own:true});
  for(i=0;i<FOODS.length;i++) out.push({key:"b"+i, f:FOODS[i], own:false});
  return out;
}
function foodByKey(k){
  if(!k) return null;
  var i=parseInt(k.slice(1),10);
  return k[0]==="c" ? (S.customFoods||[])[i] : FOODS[i];
}

function fAdd(name, kcal, prot){
  var d=ui.day;
  if(!S.food) S.food={};
  S.food[d]=(S.food[d]||[]).concat([{n:name,k:Math.round(kcal),p:Math.round(prot||0)}]);
  ui.pending=null; ui.q="";
  save();
  ui.flash = Math.round(kcal)+" kcal added";
  render();
}

function fAmount(){
  var f=foodByKey(ui.pending);
  var el=document.getElementById("amtIn");
  var amt=parseFloat(el && el.value);
  if(!f || !(amt>0)){ ui.err="Put a number in the box first."; render(); return; }
  ui.err=null;
  if(f.per100!==undefined) fAdd(f.n+" ("+amt+"g)", f.per100*amt/100, (f.p||0)*amt/100);
  else fAdd(amt===1 ? f.n : f.n+" \u00d7"+amt, f.each*amt, (f.p||0)*amt);
}

function fSaveCustom(){
  var n=((document.getElementById("cfName")||{}).value||"").trim();
  var k=parseFloat((document.getElementById("cfKcal")||{}).value);
  var pr=parseFloat((document.getElementById("cfProt")||{}).value);

  var obj={n:n, p:isNaN(pr)?0:Math.round(pr), c:"Yours"};
  if(ui.cfMode==="each") obj.each=Math.round(k); else obj.per100=Math.round(k);
  S.customFoods=(S.customFoods||[]);
  S.customFoods.unshift(obj);
  ui.showCustom=false; ui.q=n; ui.pending=null; ui.err=null;
  save();
  ui.flash="Saved "+n+" \u2014 search for it any time.";
  render();
}

function toggleQuest(id){
  var q=null; QUESTS.forEach(function(x){ if(x.id===id) q=x; });
  if(!q) return;
  var t=today(), list=(S.log[t]||[]).slice(), on=list.indexOf(id)>-1;
  if(on) list.splice(list.indexOf(id),1); else list.push(id);
  S.log[t]=list;
  S.stats[q.stat]=Math.max(0, S.stats[q.stat] + (on?-1:1));
  S.xp += on ? -q.xp : q.xp;
  S.totalXp = Math.max(0, S.totalXp + (on?-q.xp:q.xp));
  if(!on && list.length===QUESTS.length){ S.xp += 123; S.totalXp += 123; }
  var before=S.level;
  while(S.xp >= needFor(S.level)){ S.xp -= needFor(S.level); S.level++; }
  while(S.xp < 0 && S.level > 1){ S.level--; S.xp += needFor(S.level); }
  if(S.xp<0) S.xp=0;
  if(S.level>before) ui.alert={level:S.level, rank:rankFor(S.level)};
  save(); render();
}

function logWeigh(){
  var stEl=document.getElementById("wst"), lbEl=document.getElementById("wlb");
  var s=parseFloat(stEl && stEl.value), p=parseFloat((lbEl && lbEl.value) || "0");
  if(isNaN(s) || s<=0){ ui.err="Enter your weight in stone (and pounds if you like), then tap again."; render(); return; }
  var lbs = s*14 + (isNaN(p)?0:p);
  var t=today();
  S.weights = S.weights.filter(function(w){ return w.d!==t; });
  S.weights.push({d:t, lbs:lbs});
  S.weights.sort(function(a,b){ return a.d<b.d?-1:1; });
  if(S.weights.length===1) S.startLbs=lbs;
  ui.err=null; save(); render();
}

function addNote(){
  var el=document.getElementById("note");
  var v = el ? el.value.trim() : "";
  if(!v) return;
  S.journal.unshift({d:today(), t:v});
  S.journal = S.journal.slice(0,60);
  save(); render();
}

function backup(){
  var code = JSON.stringify(S);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(function(){
      ui.err="Backup code copied. Paste it into a note or message to yourself.";
      render();
    }, function(){ window.prompt("Copy this and keep it safe:", code); });
  } else {
    window.prompt("Copy this and keep it safe:", code);
  }
}

function restore(){
  var el=document.getElementById("rcode");
  var v = el ? el.value.trim() : "";
  if(!v){ ui.err="Paste your backup code into the box first."; render(); return; }
  var o;
  try{ o = JSON.parse(v); }catch(err){ o=null; }
  if(!o || typeof o!=="object" || typeof o.level!=="number"){
    ui.err="That code didn\u2019t look right \u2014 paste the whole thing, from the first { to the last }.";
    render(); return;
  }
  S = Object.assign(defaults(), o);
  if(!S.startISO) S.startISO = today();
  save();
  ui.err="Restored \u2014 your levels and weigh-ins are back.";
  render();
}

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-act]") : null;
  if(!t) return;
  var a = t.getAttribute("data-act"), id = t.getAttribute("data-id");
  if(a==="tab"){ ui.tab=id; ui.err=null; window.scrollTo(0,0); render(); }
  else if(a==="quest"){ toggleQuest(id); }
  else if(a==="ex"){ ui.ex[id] = !ui.ex[id]; render(); }
  else if(a==="rec"){ ui.rec[id] = !ui.rec[id]; render(); }
  else if(a==="weigh"){ logWeigh(); }
  else if(a==="note"){ addNote(); }
  else if(a==="backup"){ backup(); }
  else if(a==="restore"){ restore(); }
  else if(a==="ffood"){
    var k=t.getAttribute("data-k");
    ui.pending = (ui.pending===k) ? null : k;
    render();
    var ai=document.getElementById("amtIn"); if(ai){ ai.focus(); ai.select(); }
  }
  else if(a==="fchip"){ var ci=document.getElementById("amtIn"); if(ci) ci.value=t.getAttribute("data-v"); }
  else if(a==="famt"){ fAmount(); }
  else if(a==="fplate"){
    var id=t.getAttribute("data-id"), r=null;
    PLATES.forEach(function(x){ if(x.id===id) r=x; });
    if(r) fAdd(r.n+" (1 portion)", r.k, r.p);
  }
  else if(a==="fdel"){
    var di=parseInt(t.getAttribute("data-i"),10), dd=ui.day, li=fEntries(dd).slice();
    li.splice(di,1);
    if(li.length) S.food[dd]=li; else delete S.food[dd];
    save(); render();
  }
  else if(a==="fcshow"){ ui.showCustom=true; render(); }
  else if(a==="fccancel"){ ui.showCustom=false; ui.err=null; render(); }
  else if(a==="fcmode"){ ui.cfMode=t.getAttribute("data-v"); render(); }
  else if(a==="fcsave"){ fSaveCustom(); }
  else if(a==="fkcalup"){ S.kcalTarget=Math.min(3500,(S.kcalTarget||KCAL_TARGET)+50); save(); render(); }
  else if(a==="fkcaldown"){ S.kcalTarget=Math.max(1500,(S.kcalTarget||KCAL_TARGET)-50); save(); render(); }
  else if(a==="fclear"){ if(S.food) delete S.food[ui.day]; save(); render(); }
  else if(a==="fday"){
    var nx=shiftDay(ui.day, parseInt(t.getAttribute("data-n"),10));
    if(nx>today()) return;
    ui.day=nx; ui.err=null; ui.pending=null; render();
  }
  else if(a==="closeAlert"){ ui.alert=null; render(); }
});

render();

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
