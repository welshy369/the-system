<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="The System">

<title>The System</title>
<style>
:root{
  --void:#04060c; --panel:#080d18; --panel2:#0c1424; --line:#164e63;
  --cyan:#22d3ee; --cyanDim:#0e7490; --text:#c9d8e6; --mute:#5f7488;
  --green:#16a34a; --greenLit:#4ade80; --amber:#f59e0b; --red:#dc2626;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--void); color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.5; padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:16px 12px 0}
.mono{font-family:var(--mono)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyanDim)}
.hunter{font-family:var(--mono);font-size:18px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan)}
.rank{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;text-align:right}
.rank small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-top:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;margin-bottom:12px;
  box-shadow:inset 0 0 40px -34px var(--cyan)}
.panel.glow{box-shadow:0 0 24px -6px rgba(34,211,238,.33), inset 0 0 40px -30px var(--cyan)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
  border-bottom:1px solid var(--line);background:var(--panel2);
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.ph span.r{color:var(--mute);letter-spacing:.1em}
.pb{padding:12px}
.pb > * + *{margin-top:12px}

.bar{width:100%;background:#0f1b2b;border-radius:2px;overflow:hidden;height:6px}
.bar > i{display:block;height:100%;transition:width .5s}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:8px 12px}
.tile b{display:block;font-family:var(--mono);font-size:22px;font-weight:400}
.tile em{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-style:normal}
.muted{color:var(--mute)}
.amber{color:var(--amber)}
.green{color:var(--greenLit)}
.cy{color:var(--cyan)}
.small{font-size:13px;line-height:1.6}
.tiny{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--mute)}

button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:2px;
  background:var(--cyanDim);color:#04121a;border:1px solid var(--cyan);
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--cyan)}

.quest{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border-radius:2px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.quest.done{background:#07210f;border-color:var(--green)}
.tick{width:22px;height:22px;flex:0 0 22px;border:1px solid var(--cyanDim);color:transparent;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px}
.quest.done .tick{border-color:var(--greenLit);color:var(--greenLit)}
.quest .lbl{flex:1}
.quest .lbl b{display:block;font-weight:400;font-size:15px}
.quest.done .lbl b{color:var(--greenLit);text-decoration:line-through}
.quest .lbl em{display:block;font-family:var(--mono);font-size:10px;color:var(--mute);font-style:normal;margin-top:2px}
.quest .xp{font-family:var(--mono);font-size:12px;color:var(--cyanDim)}

.acc{background:var(--panel2);border:1px solid var(--line);border-radius:2px;margin-bottom:8px}
.acc.open{border-color:var(--cyan)}
.acc > button{display:block;width:100%;padding:12px}
.acc .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.acc .plus{font-family:var(--mono);font-size:14px;color:var(--cyanDim)}
.acc .sub{font-family:var(--mono);font-size:12px;margin-top:4px;color:var(--greenLit)}
.acc .sub i{color:var(--mute);font-style:normal}
.acc .meta{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.acc .body{padding:0 12px 12px}
.acc .body > * + *{margin-top:12px}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
ol.steps{margin:0;padding:0;list-style:none}
ol.steps li{display:flex;gap:8px;font-size:15px;line-height:1.6;margin-bottom:8px}
ol.steps li em{font-family:var(--mono);font-size:12px;color:var(--cyanDim);font-style:normal;flex:0 0 14px}
ul.dash{margin:0;padding:0;list-style:none}
ul.dash li{font-size:15px;line-height:1.6;margin-bottom:4px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:9px 12px;font-size:13px;line-height:1.6}
.note.good{background:#07210f;border-color:var(--green)}
.dayrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--panel2);font-size:15px}
.dayrow em{font-family:var(--mono);font-size:12px;color:var(--cyanDim);font-style:normal;flex:0 0 42px}
.hist{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--panel2);font-family:var(--mono);font-size:14px}

input,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:2px;padding:10px;font-family:var(--mono);font-size:15px;width:100%;outline:none}
textarea{font-family:var(--sans);resize:none}
input:focus,textarea:focus,button:focus-visible{border-color:var(--cyan);outline:2px solid rgba(34,211,238,.3);outline-offset:1px}
.weighrow{display:flex;gap:8px}
.weighrow input{width:70px}
.weighrow .btn{flex:1;width:auto}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;padding:13px 2px;text-align:center;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border-top:2px solid transparent}
nav button.on{color:var(--cyan);border-top-color:var(--cyan);background:var(--panel2)}

.overlay{position:fixed;inset:0;background:rgba(4,6,12,.88);display:flex;align-items:center;justify-content:center;padding:24px}
.overlay .panel{max-width:340px;width:100%;margin:0}
.lvl{font-family:var(--mono);font-size:60px;font-weight:700;color:var(--cyan);text-shadow:0 0 24px rgba(34,211,238,.55);line-height:1}
.center{text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

var EX = {
  worktopPress:{name:"Worktop press-up",works:"Chest, shoulders, back of the arms",
    how:["Stand about an arm's length from the kitchen worktop.",
      "Put both hands on the edge, a bit wider apart than your shoulders.",
      "Walk your feet backwards until your body is one straight line from your head to your heels. Squeeze your bum and tighten your stomach so your hips don't sag.",
      "Bend your elbows and lower your chest towards the worktop. Your elbows should point backwards at roughly 45 degrees, not straight out sideways.",
      "When your chest is close to the edge, push the worktop away and straighten your arms. That is one rep."],
    feel:"Working across your chest and the back of your upper arms. Not in your lower back \u2014 if you feel it there, your hips are sagging.",
    easier:"Stand more upright, or use a higher surface like a windowsill.",
    harder:"Walk your feet further back, or move down to a lower surface."},
  inclinePress:{name:"Incline press-up",works:"Chest, shoulders, back of the arms",
    how:["Same movement as the worktop press-up, but with your hands on something lower \u2014 the arm of the sofa, the third or fourth stair, a sturdy chair pushed against a wall.",
      "Hands slightly wider than your shoulders, body in one straight line, bum squeezed.",
      "Lower your chest to the surface under control \u2014 about two seconds down.",
      "Push back up until your arms are straight."],
    feel:"Harder than the worktop version because more of your bodyweight goes through your arms.",
    easier:"Go back up a step. Literally \u2014 use a higher stair.",

      "Push the floor away and straighten your arms."],
    feel:"Everything. This is the benchmark \u2014 the first full one is worth writing in the journal.",

  chairSquat:{name:"Chair squat",works:"Thighs, bum",

      "Push your hips backwards first, as if reaching for the seat with your bum. Let your knees bend as you go.",

    feel:"Front of the thighs and the bum. Knees should feel fine \u2014 if they ache, sit back further onto your heels.",

  bodyweightSquat:{name:"Bodyweight squat",works:"Thighs, bum",

  doorwayRow:{name:"Doorway row",works:"Upper back, biceps",

      "Curl up one bit at a time \u2014 head, shoulders, then upper back \u2014 until your chest is near your knees.",

    feel:"Front of the stomach. Neck stays relaxed throughout.",
    easier:"Crunches \u2014 just lift your head and shoulders a few inches.",
    harder:"Arms crossed behind your head, or slow it down."}

/* =========================== HELPERS ============================== */

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function needFor(l){ return 369 + (l-1)*123; }
function rankFor(l){ var r=RANKS[0]; for(var i=0;i<RANKS.length;i++){ if(l>=RANKS[i].min) r=RANKS[i]; } return r; }
function rankColour(letter){ for(var i=0;i<RANKS.length;i++){ if(RANKS[i].r===letter) return RANKS[i].c; } return RANKS[0].c; }
function lbsToSt(lbs){ var st=Math.floor(lbs/14), rem=Math.round(lbs-st*14);
  return rem===14 ? (st+1)+" st 0 lb" : st+" st "+rem+" lb"; }
function curWeek(){ return Math.max(1, Math.floor(daysBetween(S.startISO, today())/7)+1); }
function curPhase(){ var w=curWeek(); for(var i=0;i<PHASES.length;i++){ if(w>=PHASES[i].wk[0] && w<=PHASES[i].wk[1]) return PHASES[i]; } return PHASES[PHASES.length-1]; }
function doneToday(){ return S.log[today()] || []; }
function streak(){
  var n=0;
  for(var i=0;i<400;i++){
    var d=iso(new Date(Date.now()-i*86400000)); var c=S.log[d]||[];
    if(c.length>=4){ n++; } else if(i===0){ continue; } else { break; }
  }
  return n;
}
function currentLbs(){ return S.weights.length ? S.weights[S.weights.length-1].lbs : S.startLbs; }

function bar(pct,colour,h){
  pct = Math.max(0, Math.min(100, pct));
  return '<div class="bar" style="height:'+(h||6)+'px"><i style="width:'+pct+'%;background:'+colour+';box-shadow:0 0 10px '+colour+'"></i></div>';
}
function panel(title,body,opt){
  opt=opt||{};
  return '<div class="panel'+(opt.glow?" glow":"")+'"><div class="ph"><span>'+esc(title)+'</span>'+
    (opt.right?'<span class="r">'+esc(opt.right)+'</span>':'')+'</div><div class="pb">'+body+'</div></div>';
}

function spark(){
  if(S.weights.length<2) return '<div class="tiny">Two weigh-ins will draw the line here.</div>';
  var vals=S.weights.map(function(w){return w.lbs;});
  var min=Math.min.apply(null,vals.concat([S.targetLbs]))-2, max=Math.max.apply(null,vals)+2;
  var W=300,H=70, pts=[];
  for(var i=0;i<S.weights.length;i++){
    var x=(i/(S.weights.length-1))*W, y=H-((S.weights[i].lbs-min)/(max-min))*H;
    pts.push(x.toFixed(1)+","+y.toFixed(1));
  }
  var ty=H-((S.targetLbs-min)/(max-min))*H;
  var dots="";
  pts.forEach(function(p){ var a=p.split(","); dots+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="2.5" fill="#22d3ee"/>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:70px">'+
    '<line x1="0" y1="'+ty.toFixed(1)+'" x2="'+W+'" y2="'+ty.toFixed(1)+'" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 4"/>'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="#22d3ee" stroke-width="2"/>'+dots+'</svg>';
}

    ' <i>\u00b7 rest '+esc(item.rest)+'</i></div></button>';
  if(open){
    h += '<div class="body"><div class="mono" style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)">Works \u2014 '+esc(e.works)+'</div><ol class="steps">';
    e.how.forEach(function(s,i){ h += '<li><em>'+(i+1)+'</em><span>'+esc(s)+'</span></li>'; });
    h += '</ol><div class="small amber">What it should feel like \u2014 '+esc(e.feel)+'</div>'+
      '<div class="note"><div class="lab" style="color:var(--greenLit)">Too hard?</div>'+esc(e.easier)+'</div>'+
      '<div class="note"><div class="lab">Too easy?</div>'+esc(e.harder)+'</div></div>';
  }
  return h+'</div>';
}

function viewTraining(){
  var ph=curPhase(), w=curWeek(), h="";

  h += panel("How to read the plan",
    '<div class="small"><p style="margin:0 0 10px"><b class="cy">A rep</b> is one single movement \u2014 going down and back up once. Short for repetition.</p>'+
    '<p style="margin:0 0 10px"><b class="cy">A set</b> is a batch of reps done back to back without stopping. Then you rest, then you do the next set.</p>'+
    '<p style="margin:0 0 10px" class="muted">So "3 sets of 5 reps, rest 90 seconds" means: 5 press-ups, sit down for a minute and a half, 5 more, rest again, 5 more, done. Fifteen press-ups in total, spread over about five minutes.</p>'+
    '<p style="margin:0 0 10px"><b class="cy">Rest</b> means properly rest. You should be able to talk in full sentences before the next set.</p>'+
    '<p style="margin:0 0 10px"><b class="cy">When to move up</b> \u2014 when you can finish every set with two reps still left in you, use the harder version listed on the exercise.</p>'+
    '<p style="margin:0" class="amber">Tap any exercise below for how to do it, what it should feel like, and what to do if it\u2019s too hard or too easy.</p></div>', {glow:true});

  var pb = '<div class="note" style="background:var(--panel2)"><span class="mono green" style="font-size:12px">WALKING \u2014 '+esc(ph.cardio)+'</span></div><div>'+
    '<div class="lab" style="color:var(--mute)">Your week</div>';
  ph.week.forEach(function(r){
    pb += '<div class="dayrow"><em>'+r[0]+'</em><span'+(r[1].indexOf("Rest")>-1?' class="muted"':'')+'>'+esc(r[1])+'</span></div>';
  });
  pb += '</div><div class="small amber">'+esc(ph.note)+'</div>';
  h += panel(ph.rank+"-rank \u00b7 "+ph.name, pb, {right:"Week "+w});

  var wu='<ol class="steps">';
  WARMUP.forEach(function(s,i){ wu += '<li><em>'+(i+1)+'</em><span>'+esc(s)+'</span></li>'; });
  wu += '</ol><div class="tiny">Five minutes. Non-negotiable \u2014 it\u2019s most of your injury insurance.</div>';
  h += panel("Warm-up \u2014 every session", wu);

  if(ph.circuit) h += panel("How this circuit works", '<div class="small">'+esc(ph.circuit)+'</div>');

  ph.sessions.forEach(function(s,si){
    var b="";
    s.ex.forEach(function(item,i){ b += exCard(item, si+"-"+i); });
    h += panel(s.title, b);
  });

  var cd='<ul class="dash">';
  COOLDOWN.forEach(function(c){ cd += '<li>\u2014 '+esc(c)+'</li>'; });
  h += panel("Cool-down", cd+'</ul>');

  var camp="";
  PHASES.forEach(function(p){
    var active = w>=p.wk[0] && w<=p.wk[1], cleared = w>p.wk[1];
    camp += '<div class="row" style="padding:8px 12px;border-radius:2px;margin-bottom:8px;background:'+(active?"#07210f":"var(--panel2)")+
      ';border:1px solid '+(active?"var(--green)":"var(--line)")+'">'+
      '<span class="mono muted" style="font-size:12px;width:62px">WK '+p.wk[0]+'\u2013'+p.wk[1]+'</span>'+
      '<span class="mono" style="font-size:12px;width:18px;color:'+rankColour(p.rank)+'">'+p.rank+'</span>'+
      '<span style="flex:1;font-size:15px'+(active?";color:var(--greenLit)":"")+'">'+esc(p.name)+'</span>'+
      '<span class="mono" style="font-size:10px;color:'+(cleared?"var(--greenLit)":"var(--mute)")+'">'+(cleared?"CLEARED":active?"ACTIVE":"LOCKED")+'</span></div>';
  });
  h += panel("Full campaign", camp);

  var eg='<ul class="dash mono">';
  ENDGAME.forEach(function(e){ eg += '<li>\u2014 '+esc(e)+'</li>'; });
  eg += '</ul><div class="small amber">Saitama\u2019s routine, and a joke in the manga for a reason. It\u2019s where the road points, not where it starts. Getting there inside a year would put you in the top few percent of people alive.</div>';
  h += panel("Endgame protocol", eg);

  h += panel("Aches, pains and stopping",
    '<div class="small"><p style="margin:0 0 8px"><span class="green">Normal:</span> stiff, achy muscles for a day or two after a session, worst about 48 hours later. It fades as you get fitter.</p>'+
    '<p style="margin:0 0 8px"><span class="amber">Back off:</span> an ache still there four days later, or the same joint grumbling every session. Drop to the easier version for a week.</p>'+
    '<p style="margin:0"><span style="color:var(--red)">Stop and get it looked at:</span> sharp or stabbing pain, pain on one side only, chest pain, dizziness, or anything that makes you catch your breath.</p></div>');
  return h;
}

function recCard(r){
  var open=!!ui.rec[r.id];
  var h='<div class="acc'+(open?" open":"")+'"><button data-act="rec" data-id="'+r.id+'">'+
    '<div class="t"><span>'+esc(r.name)+'</span><span class="plus">'+(open?"\u2212":"+")+'</span></div>'+
    '<div class="meta">'+esc(r.tag)+' \u00b7 serves '+r.serves+' \u00b7 '+esc(r.time)+'</div></button>';
  if(open){
    h += '<div class="body"><div><div class="lab">You need</div><ul class="dash">';
    r.ings.forEach(function(i){ h += '<li>\u2014 '+esc(i)+'</li>'; });
    h += '</ul></div><div><div class="lab">Method</div><ol class="steps">';
    r.steps.forEach(function(s,i){ h += '<li><em>'+(i+1)+'</em><span>'+esc(s)+'</span></li>'; });
    h += '</ol></div><div class="note good"><div class="lab" style="color:var(--greenLit)">Your plate</div>'+esc(r.yours)+'</div>'+
      '<div class="small muted">'+esc(r.note)+'</div></div>';
  }
  return h+'</div>';
}

function viewFood(){
  var h="";
  h += panel("Daily targets",
    '<div class="grid3">'+
    '<div class="tile" style="text-align:center"><b class="cy">1,850</b><em>kcal</em></div>'+
    '<div class="tile" style="text-align:center"><b class="cy">150 g</b><em>protein</em></div>'+
    '<div class="tile" style="text-align:center"><b class="cy">2 L</b><em>water</em></div></div>'+
    '<div class="small muted">Same pot, bigger ladle. These are the ten recipes from her plan \u2014 you eat the same food, cooked once, with a larger portion on your plate. Every recipe has a green box telling you exactly what to add to yours. She\u2019s on around 1,500 a day; you\u2019re on roughly 1,850, which is about a pound a week off you.</div>', {glow:true});

  var rb="";
  RECIPES.forEach(function(r){ rb += recCard(r); });
  h += panel("The recipes \u2014 tap for the method", rb);

  var wk="";
  DAYPLAN.forEach(function(row,i){
    wk += '<div style="padding:8px 0'+(i?';border-top:1px solid var(--panel2)':'')+'">'+
      '<div class="lab" style="color:var(--cyanDim);margin-bottom:2px">'+esc(row[0])+'</div>'+
      '<div class="small">'+esc(row[1])+' \u00b7 '+esc(row[2])+' \u00b7 '+esc(row[3])+'<span class="muted"> \u00b7 '+esc(row[4])+'</span></div></div>';
  });
  wk += '<div class="small amber">Notice how often leftovers appear. Cook once on Sunday, eat three times.</div>';
  h += panel("A week, sketched out", wk);

  var sh="";
  SHOPPING.forEach(function(sec){
    sh += '<div><div class="lab">'+esc(sec[0])+'</div><ul class="dash">';
    sec[1].forEach(function(it){ sh += '<li>\u2014 '+esc(it)+'</li>'; });
    sh += '</ul></div>';
  });
  sh += '<div class="small amber">Covers the week above for two people. Own-brand everything \u2014 the tin of tomatoes doesn\u2019t know it\u2019s cheap. Frozen veg is as good as fresh and never rots.</div>';
  h += panel("One shop", sh);

  h += panel("Method",
    '<div class="small"><p style="margin:0 0 8px">1. Sunday: cook the chilli and the lentil soup. That\u2019s most of two weeks of lunches in the freezer.</p>'+
    '<p style="margin:0 0 8px">2. Boil six eggs while you\u2019re at it. Snack drawer sorted.</p>'+
    '<p style="margin:0 0 8px">3. Weigh oats, rice and pasta dry for the first fortnight. After that you\u2019ll eyeball it right.</p>'+
    '<p style="margin:0 0 8px">4. Pint of water before every meal.</p>'+
    '<p style="margin:0 0 8px">5. Liquid calories are the quiet killer \u2014 pop, juice and pints. Swapping those alone may cover most of your deficit.</p>'+
    '<p style="margin:0" class="muted">One meal off plan doesn\u2019t undo a week. Note it, move on, don\u2019t write the whole day off.</p></div>');
  return h;
}

function viewLog(){
  var h="";
  var jb = '<textarea id="note" rows="3" placeholder="First full press-up. Felt like a boss kill."></textarea>'+
    '<button class="btn" data-act="note">Record entry</button>';
  if(!S.journal.length) jb += '<div class="tiny">Nothing recorded yet. Start with the reps you can\u2019t do today \u2014 they read very differently in eight weeks.</div>';
  S.journal.forEach(function(j){
    jb += '<div class="tile"><div class="mono" style="font-size:10px;color:var(--cyanDim)">'+esc(j.d)+'</div><div class="small">'+esc(j.t)+'</div></div>';
  });
  h += panel("Hunter\u2019s journal", jb);

  var wb="";
  if(!S.weights.length) wb = '<div class="tiny">No weigh-ins yet. Add the first from the Status tab.</div>';
  else {
    for(var i=S.weights.length-1;i>=0;i--){
      wb += '<div class="hist"><span class="muted">'+esc(S.weights[i].d)+'</span><span>'+lbsToSt(S.weights[i].lbs)+'</span></div>';
    }
  }
  h += panel("Weigh-in history", wb);
  return h;
}

var TABS=[["status","Status"],["quests","Quests"],["training","Training"],["food","Food"],["log","Log"]];

function render(){
  var y = window.scrollY;
  var rk = rankFor(S.level);
  var h = '<div class="head"><div><div class="eyebrow">The System</div><div class="hunter">Hunter: Mark</div></div>'+
    '<div class="rank" style="color:'+rk.c+';text-shadow:0 0 14px '+rk.c+'88">'+rk.r+'<small>RANK</small></div></div>';
  if(ui.err) h += '<div class="panel" style="border-color:var(--red);background:#2a0d0d"><div class="pb"><div class="mono" style="font-size:12px;color:#fca5a5">'+esc(ui.err)+'</div></div></div>';

  if(ui.tab==="status") h += viewStatus();
  else if(ui.tab==="quests") h += viewQuests();
  else if(ui.tab==="training") h += viewTraining();
  else if(ui.tab==="food") h += viewFood();
  else h += viewLog();

  if(ui.alert){
    h += '<div class="overlay" data-act="closeAlert"><div class="panel glow"><div class="ph"><span>Notification</span></div>'+
      '<div class="pb center"><div class="mono amber" style="font-size:11px;letter-spacing:.3em">LEVEL UP</div>'+
      '<div class="lvl">'+ui.alert.level+'</div>'+
      '<div class="mono" style="font-size:14px;color:'+ui.alert.rank.c+'">'+ui.alert.rank.r+'-RANK HUNTER</div>'+
      '<button class="btn" data-act="closeAlert">Accept</button></div></div></div>';
  }

  document.getElementById("app").innerHTML = h;
  var nav="";
  TABS.forEach(function(t){ nav += '<button data-act="tab" data-id="'+t[0]+'" class="'+(ui.tab===t[0]?"on":"")+'">'+t[1]+'</button>'; });
  document.getElementById("nav").innerHTML = nav;
  window.scrollTo(0,y);
}

/* ============================ ACTIONS ============================= */

function toggleQuest(id){
  var q=null; QUESTS.forEach(function(x){ if(x.id===id) q=x; });
  if(!q) return;
  var t=today(), list=(S.log[t]||[]).slice(), on=list.indexOf(id)>-1;
  if(on) list.splice(list.indexOf(id),1); else list.push(id);
  S.log[t]=list;
  S.stats[q.stat]=Math.max(0, S.stats[q.stat] + (on?-1:1));
  S.xp += on ? -q.xp : q.xp;
  S.totalXp = Math.max(0, S.totalXp + (on?-q.xp:q.xp));
  if(!on && list.length===QUESTS.length){ S.xp += 123; S.totalXp += 123; }
  var before=S.level;
  while(S.xp >= needFor(S.level)){ S.xp -= needFor(S.level); S.level++; }
  while(S.xp < 0 && S.level > 1){ S.level--; S.xp += needFor(S.level); }
  if(S.xp<0) S.xp=0;
  if(S.level>before) ui.alert={level:S.level, rank:rankFor(S.level)};
  save(); render();
}

function logWeigh(){
  var stEl=document.getElementById("wst"), lbEl=document.getElementById("wlb");
  var s=parseFloat(stEl && stEl.value), p=parseFloat((lbEl && lbEl.value) || "0");
  if(isNaN(s) || s<=0){ ui.err="Enter your weight in stone (and pounds if you like), then tap again."; render(); return; }
  var lbs = s*14 + (isNaN(p)?0:p);
  var t=today();
  S.weights = S.weights.filter(function(w){ return w.d!==t; });
  S.weights.push({d:t, lbs:lbs});
  S.weights.sort(function(a,b){ return a.d<b.d?-1:1; });
  if(S.weights.length===1) S.startLbs=lbs;
  ui.err=null; save(); render();
}

function addNote(){
  var el=document.getElementById("note");
  var v = el ? el.value.trim() : "";
  if(!v) return;
  S.journal.unshift({d:today(), t:v});
  S.journal = S.journal.slice(0,60);
  save(); render();
}

function backup(){
  var code = JSON.stringify(S);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(function(){
      ui.err="Backup code copied. Paste it into a note or message to yourself.";
      render();
    }, function(){ window.prompt("Copy this and keep it safe:", code); });
  } else {
    window.prompt("Copy this and keep it safe:", code);
  }
}

function restore(){
  var el=document.getElementById("rcode");
  var v = el ? el.value.trim() : "";
  if(!v){ ui.err="Paste your backup code into the box first."; render(); return; }
  var o;
  try{ o = JSON.parse(v); }catch(err){ o=null; }
  if(!o || typeof o!=="object" || typeof o.level!=="number"){
    ui.err="That code didn\u2019t look right \u2014 paste the whole thing, from the first { to the last }.";
    render(); return;
  }
  S = Object.assign(defaults(), o);
  if(!S.startISO) S.startISO = today();
  save();
  ui.err="Restored \u2014 your levels and weigh-ins are back.";
  render();
}

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-act]") : null;
  if(!t) return;
  var a = t.getAttribute("data-act"), id = t.getAttribute("data-id");
  if(a==="tab"){ ui.tab=id; ui.err=null; window.scrollTo(0,0); render(); }
  else if(a==="quest"){ toggleQuest(id); }
  else if(a==="ex"){ ui.ex[id] = !ui.ex[id]; render(); }
  else if(a==="rec"){ ui.rec[id] = !ui.rec[id]; render(); }
  else if(a==="weigh"){ logWeigh(); }
  else if(a==="note"){ addNote(); }
  else if(a==="backup"){ backup(); }
  else if(a==="restore"){ restore(); }
  else if(a==="closeAlert"){ ui.alert=null; render(); }
});

render();

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
