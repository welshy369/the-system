<html lang="en-GB">

<style>
  :root{
    --ink:#22303A; --soft:#5B6B75; --card:#FBF7F0; --edge:#E8DFD1;
    --rule:#CBDDE6; --tin:#35566B; --red:#C4483C; --ochre:#D9A441; --green:#4F7A57;
    --display:"Zilla Slab", Georgia, "Iowan Old Style", serif;
    --body:"Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--tin);font-family:var(--body);color:var(--ink);
    -webkit-text-size-adjust:100%;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header{padding:calc(30px + env(safe-area-inset-top)) 6px 18px}
  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:rgba(255,255,255,.6)}
  h1{font-family:var(--display);font-size:34px;font-weight:700;color:#fff;margin:6px 0 4px;line-height:1.05}
  .sub{font-size:14px;color:rgba(255,255,255,.72)}

  nav{display:flex;gap:3px}
  nav button{flex:1;border:0;cursor:pointer;padding:11px 4px 12px;border-radius:6px 6px 0 0;
    background:rgba(255,255,255,.13);color:rgba(255,255,255,.85);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  nav button[aria-current="true"]{background:var(--card);color:var(--ink)}

  .stack{display:grid;gap:12px;padding-top:12px}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:3px;position:relative;overflow:hidden;
    box-shadow:0 1px 0 rgba(34,48,58,.06),0 2px 8px rgba(34,48,58,.05);padding:16px 18px 18px 36px}
  .card::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1px;background:var(--red);opacity:.35}
  .alert{background:#FFF3F1;border:1px solid var(--red);border-radius:3px;padding:14px 16px}
  .alert::before{display:none}
  .alert h2{color:var(--red)}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
  h2{font-family:var(--display);font-size:22px;font-weight:600;margin:4px 0 10px;line-height:1.2}
  h3{font-family:var(--display);font-size:20px;font-weight:600;margin:4px 0 10px;line-height:1.2}
  p{font-size:15px;line-height:1.65;margin:0 0 10px}
  .muted{color:var(--soft)}
  .divide{border-top:1px solid var(--rule);margin:12px 0}
  ul,ol{margin:6px 0 12px;padding-left:19px}
  li{font-size:15px;line-height:1.6;margin-bottom:6px}

  .acc{border-top:1px solid var(--rule);padding-top:11px;margin-top:11px}
  .acc>button{background:none;border:0;padding:0;cursor:pointer;width:100%;text-align:left;display:block}
  .acc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .acc-title{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink)}
  .plus{font-family:var(--mono);font-size:17px;color:var(--red)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.05em;margin-top:3px}

  .habit{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--rule);
    padding:12px 2px;cursor:pointer;text-align:left;width:100%;font-family:var(--body)}
  .box{width:22px;height:22px;flex:0 0 auto;border:1.5px solid var(--soft);border-radius:2px;display:grid;
    place-items:center;color:#fff;font-size:13px;font-weight:700}
  .habit[aria-pressed="true"] .box{background:var(--green);border-color:var(--green)}
  .habit span.lbl{font-size:15.5px}
  .habit[aria-pressed="true"] span.lbl{color:var(--soft);text-decoration:line-through}

  .stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
  .stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:700}
  .stat small{font-size:12.5px;color:var(--soft)}

  .move{margin-bottom:16px}
  .move-head{display:flex;gap:8px;align-items:baseline}
  .num{font-family:var(--mono);font-size:11px;color:var(--red);font-weight:700}
  .move-name{font-family:var(--display);font-size:17px;font-weight:600}
  .reps{font-family:var(--mono);font-size:12.5px;color:var(--tin);margin:3px 0 5px;padding-left:24px}
  .how{font-size:14.5px;line-height:1.6;padding-left:24px}
  .cue{font-size:13.5px;font-style:italic;color:var(--soft);padding-left:24px;margin-top:4px}
  .warm{font-size:14px;color:var(--soft);margin-bottom:14px;padding-left:10px;border-left:2px solid var(--ochre)}
  .extra{background:rgba(79,122,87,.10);border-left:2px solid var(--green);padding:12px 14px;margin-top:6px}
  .extra .tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700}
  .note{background:rgba(217,164,65,.14);border-left:2px solid var(--ochre);padding:9px 12px;font-size:14px}

  .sched{border-top:1px solid var(--rule);margin-top:12px;padding-top:10px}
  .sched-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px;border-bottom:1px dotted var(--rule)}
  .sched-row:last-child{border-bottom:0}
  .sched-day{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);padding-top:3px}

  label.f{flex:1 1 90px}
  label.f div{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--soft);margin-bottom:4px}
  input{width:100%;padding:10px;border:1px solid var(--edge);background:#fff;font-family:var(--mono);
    font-size:17px;color:var(--ink);border-radius:2px}
  .btn{padding:12px;background:var(--tin);color:#fff;border:0;border-radius:2px;font-family:var(--mono);
    font-size:12px;letter-spacing:.14em;font-weight:700;cursor:pointer;width:100%}
  .btn.small{width:auto;padding:9px 16px;font-size:11px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--edge)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  .mile{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding:9px 0;font-size:15px}
  .dot{width:18px;height:18px;border-radius:9px;border:1.5px solid var(--edge);flex:0 0 auto}
  .mile.hit .dot{background:var(--green);border-color:var(--green)}
  .mile.hit span{color:var(--soft);text-decoration:line-through}
  .mile .lb{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--soft)}

  .weighrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;padding:4px 0}
  .flash{background:var(--green);color:#fff;font-size:14px;padding:9px 14px;border-radius:2px;margin-bottom:12px}
  footer{font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.6;padding:14px 6px 0}

  .daybar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .daylbl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .step{background:#fff;border:1px solid var(--edge);border-radius:2px;width:34px;height:30px;
    font-size:17px;color:var(--ink);cursor:pointer;line-height:1}
  .step[disabled]{opacity:.3;cursor:default}
  .big{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1}
  .big .of{font-size:14px;font-weight:400;color:var(--soft);letter-spacing:0}
  .bar{height:8px;background:#EFE7DA;border-radius:4px;overflow:hidden;margin:12px 0 8px}
  .bar i{display:block;height:100%;background:var(--tin)}
  .leftline{font-size:14.5px;color:var(--soft)}

  .fitem{border-top:1px solid var(--rule)}
  .fitem>button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;
    background:none;border:0;padding:11px 2px;cursor:pointer;text-align:left;font-family:var(--body)}
  .fname{font-size:15px;color:var(--ink)}
  .own{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--green);border:1px solid var(--green);border-radius:2px;padding:1px 4px;margin-left:4px}
  .fkcal{font-family:var(--mono);font-size:12px;color:var(--soft);white-space:nowrap}

  .amt{background:rgba(53,86,107,.07);padding:12px;margin:0 0 10px;border-left:2px solid var(--tin)}
  .amt-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
  .amt-row{display:flex;gap:8px;align-items:stretch}
  .amt-row input{flex:1}
  .amt-row .btn{width:auto;padding:0 18px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{background:#fff;border:1px solid var(--edge);border-radius:2px;padding:7px 11px;
    font-family:var(--body);font-size:13px;color:var(--ink);cursor:pointer}
  .chip.sel{background:var(--tin);color:#fff;border-color:var(--tin)}
  .chip b{font-family:var(--mono);font-size:11px;color:var(--soft);font-weight:400}
  .chip.sel b{color:rgba(255,255,255,.7)}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  .logrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding:11px 0}
  .lname{font-size:15px;flex:1}
  .lk{font-family:var(--mono);font-size:13px;color:var(--soft)}
  .del{background:none;border:0;font-size:20px;color:var(--soft);cursor:pointer;padding:0 2px;line-height:1}

  button:focus-visible,input:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker" id="weeklabel">WEEK 01 OF 12</div>
    <h1>The Kitchen<br>Table Plan</h1>
    <div class="sub" id="phaselabel"></div>
  </header>
  <nav id="tabs"></nav>
  <div class="stack" id="view"></div>
  <footer>
    General guidance, not medical advice. Worth a quick word with your GP before starting — especially if there's
    anything going on with blood pressure, joints, or medication. Your data is saved on this phone only.
  </footer>
</div>

<script>
"use strict";

/* ============================ DATA ============================ */

var EX = {
  sitStand:{n:"Sit-to-stand",h:"Sit on the front edge of a dining chair, feet flat and slightly apart. Lean your chest forward over your knees, push through your heels and stand up tall. Sit back down slowly, counting to three. Hands on your thighs to help if you need them.",c:"Slow on the way down is where the work happens."},
  wallPress:{n:"Wall press-up",h:"Stand an arm's length from a wall. Hands flat on the wall at chest height, a bit wider than your shoulders. Bend your elbows and bring your chest towards the wall, then push back. Keep your body in one straight line from head to heels.",c:"Step further back from the wall to make it harder."},
  counterPress:{n:"Kitchen counter press-up",h:"Same as the wall press-up, but hands on the edge of the worktop or the back of a sturdy sofa. Lower your chest to the edge, push back up.",c:"The lower the surface, the harder it gets. Stairs are the next step down."},
  kneePress:{n:"Knee press-up",h:"On the floor, knees down, hands under your shoulders, ankles crossed. Lower your chest towards the floor as far as feels controlled, then push back up. Keep your hips in line with your shoulders — don't let your bum stick up.",c:"Half a rep done well beats a full rep flopped out."},
  march:{n:"Standing march",h:"Stand tall, one hand on the back of a chair. Lift one knee to hip height, put it down, lift the other. Steady rhythm. Swing the arms if you're steady enough without the chair.",c:"Chest up, don't lean back."},
  heelRaise:{n:"Heel raise",h:"Hold the worktop. Push up onto your tiptoes, hold for a second at the top, lower slowly.",c:"Take three seconds to come back down."},
  bridge:{n:"Glute bridge",h:"Lie on your back, knees bent, feet flat and hip-width apart, arms by your sides. Squeeze your bum and lift your hips until your body makes a straight ramp from knees to shoulders. Hold for two, lower slowly.",c:"Squeeze your bum, not your lower back."},
  kneeLift:{n:"Seated knee lift",h:"Sit tall on a chair, hands on the seat edge either side of you. Lift one knee a few inches, hold for two, lower. Alternate legs. Back straight, no slumping.",c:"Breathe out as you lift."},
  stepUp:{n:"Step-up",h:"Stand at the bottom stair, hold the bannister. Step up with your right foot, bring the left up to meet it. Step down right, then left. Do all your reps leading with the right, then swap.",c:"Push through the heel of the foot that's on the stair."},
  boxSquat:{n:"Box squat",h:"Stand in front of a chair, feet shoulder-width. Push your hips back like you're closing a car door with your bum. Lower until you just touch the seat, then stand straight back up without properly sitting down.",c:"Knees track out over your toes, never falling inwards."},
  bagRow:{n:"Shopping bag row",h:"Put a few tins in two carrier bags, or grab two big water bottles. Feet hip-width, knees soft, hinge forward from the hips until your chest is at about 45 degrees. Let your arms hang, then pull both elbows back towards your hips, squeezing your shoulder blades together. Lower slowly.",c:"Pull with your back, not your hands."},
  hipHinge:{n:"Hip hinge",h:"Feet hip-width, a bag of shopping held in front of your thighs, knees soft. Push your hips backwards and let the bag slide down your thighs, keeping your back flat. Stop when you feel a stretch down the back of your legs, then drive your hips forward to stand tall.",c:"Back stays flat like a table top."},
  splitSquat:{n:"Supported split squat",h:"Hold a chair back with one hand. Take a long step back with your right foot, back heel up. Lower your back knee straight down towards the floor, then push back up through your front heel. All reps on one side, then swap.",c:"Go down, not forward."},
  plankKnee:{n:"Knee plank",h:"Forearms and knees on the floor, elbows under your shoulders. Squeeze your bum and pull your belly button in so your body makes a straight line from knees to head. Hold and keep breathing.",c:"The second your lower back sags, stop the clock."},
  sidePlank:{n:"Side plank on knees",h:"Lie on your side, forearm on the floor with your elbow under your shoulder, knees bent. Lift your hips so you make a straight line from knees to head. Hold, then swap sides.",c:"Stack your shoulders — don't roll forwards."},
  fullSquat:{n:"Bodyweight squat",h:"Feet shoulder-width, toes turned slightly out, arms straight out in front for balance. Sit down and back as far as you comfortably can, heels stuck to the floor, chest up. Drive back up through your heels.",c:"Keep the chair behind you as a safety net if you want it."},
  overhead:{n:"Overhead press",h:"A bottle or a tin in each hand at shoulder height, palms facing forward. Press both straight up overhead until your arms lock out, then lower under control.",c:"Don't lean back — squeeze your bum to stay upright."}
};

var SESSIONS = {
  S1:{name:"The Basics",
    warm:"3 minutes marching on the spot, then roll your shoulders back 10 times and circle your ankles both ways.",
    work:[[EX.sitStand,"2 sets of 8"],[EX.wallPress,"2 sets of 8"],[EX.march,"2 sets of 20 (10 each leg)"],[EX.heelRaise,"2 sets of 10"],[EX.kneeLift,"2 sets of 10"]],
    extra:[EX.bridge,"2 sets of 8"]},
  S2:{name:"The Basics, Plus Stairs",
    warm:"4 minutes marching, shoulder rolls, then 10 slow hip circles each way.",
    work:[[EX.boxSquat,"3 sets of 8"],[EX.counterPress,"3 sets of 8"],[EX.stepUp,"2 sets of 8 each leg"],[EX.bridge,"3 sets of 10"],[EX.kneeLift,"2 sets of 12"]],
    extra:[EX.plankKnee,"2 holds of 10 seconds"]},
  S3A:{name:"Squat and Push",
    warm:"5 minutes brisk walking round the house, then 10 arm circles each way.",
    work:[[EX.boxSquat,"3 sets of 10"],[EX.counterPress,"3 sets of 10"],[EX.bagRow,"3 sets of 10"],[EX.bridge,"3 sets of 12"],[EX.plankKnee,"3 holds of 15 seconds"]],
    extra:[EX.heelRaise,"3 sets of 15"]},
  S3B:{name:"Hinge and Pull",
    warm:"5 minutes brisk walking, 10 arm circles, then 10 hip hinges holding nothing.",
    work:[[EX.hipHinge,"3 sets of 10"],[EX.splitSquat,"2 sets of 8 each leg"],[EX.kneePress,"3 sets of 6"],[EX.overhead,"3 sets of 10"],[EX.sidePlank,"2 holds of 15 seconds each side"]],
    extra:[EX.bagRow,"2 sets of 12"]},
  S4A:{name:"Squat and Push",
    warm:"5 minutes brisk walking, arm circles, then 10 bodyweight squats with no weight.",
    work:[[EX.fullSquat,"3 sets of 12"],[EX.kneePress,"3 sets of 10"],[EX.bagRow,"3 sets of 12"],[EX.stepUp,"3 sets of 10 each leg"],[EX.plankKnee,"3 holds of 30 seconds"]],
    extra:[EX.overhead,"2 sets of 12"]},
  S4B:{name:"Hinge and Pull",
    warm:"5 minutes brisk walking, arm circles, then 10 hip hinges holding nothing.",
    work:[[EX.hipHinge,"3 sets of 12"],[EX.splitSquat,"3 sets of 10 each leg"],[EX.overhead,"3 sets of 12"],[EX.bagRow,"3 sets of 12"],[EX.sidePlank,"3 holds of 25 seconds each side"]],
    extra:[EX.fullSquat,"2 sets of 15"]}
};

var DAYNAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

var PHASES=[
  {weeks:[1,2],name:"Getting moving",
   walk:"10 to 20 minutes, every day. Start at 10 and add a minute or two whenever it stops feeling like effort.",
   days:{1:"S1",3:"S1",5:"S1"},optional:{},
   note:"Two weeks of just showing up. The same session three times so it becomes familiar. Nothing here should leave you gasping — if it does, slow down and do fewer reps."},
  {weeks:[3,4],name:"Building the habit",
   walk:"25 minutes, every day. Make one of them brisk enough that holding a conversation takes a bit of effort.",
   days:{1:"S2",3:"S2",5:"S2"},optional:{},
   note:"Still one session three times a week, but three sets instead of two, and the stairs come into it. You'll ache a bit the day after the first one. That fades and it doesn't come back."},
  {weeks:[5,6,7,8],name:"Getting stronger",
   walk:"30 to 40 minutes most days. Twice a week, walk up a hill or put the treadmill on an incline.",
   days:{1:"S3A",3:"S3B",5:"S3A"},optional:{},
   note:"Two different sessions now. Squat and Push comes round twice a week, Hinge and Pull once — that's deliberate, not a mistake. Add another tin to the bags whenever 12 reps starts feeling easy."},
  {weeks:[9,10,11,12],name:"Intermediate",
   walk:"40 minutes most days, plus one interval walk a week: 2 minutes fast, 2 minutes easy, repeated 6 times.",
   days:{1:"S4A",3:"S4B",5:"S4A",6:"S4B"},optional:{6:true},
   note:"Same two sessions, harder versions. Saturday is optional — take it if the week has gone well, drop it without guilt if it hasn't. Three done beats four skipped."}
];

var RECIPES=[
 {id:"oats",name:"Banana porridge",serves:1,kcal:350,time:"5 min",tag:"Breakfast",
  ings:["50g porridge oats","250ml semi-skimmed milk (or half milk, half water)","1 banana","Pinch of salt","Cinnamon if you have it"],
  steps:["Tip the oats into a saucepan with the milk and a pinch of salt.","Medium heat, and stir. Keep stirring — it catches on the bottom the second you wander off.","After about 4 minutes it thickens and starts to bubble. Take it off the heat.","Slice the banana in and stir. The heat turns it sweet, so you don't need sugar.","Cinnamon on top if you've got it."],
  note:"Cold version: same oats, same milk, in a jar in the fridge overnight. Grab it and go."},
 {id:"eggsbeans",name:"Eggs and beans on toast",serves:1,kcal:400,time:"8 min",tag:"Breakfast",
  ings:["2 eggs","Half a tin of baked beans","2 slices wholemeal bread","Splash of milk","Salt and pepper"],
  steps:["Beans into a small pan on a low heat. Toast on.","Crack the eggs into a bowl, add a splash of milk, salt and pepper. Beat with a fork until there are no streaks of white left.","Non-stick pan on medium-low, the smallest bit of oil or a spray.","Pour the eggs in. Leave them completely alone for 20 seconds, then push them slowly from the edges into the middle with a wooden spoon.","Take them off the heat while they still look slightly too wet — they carry on cooking in the pan.","Toast, beans, eggs. Done."],
  note:"Low heat and patience is the entire trick with scrambled eggs."},
 {id:"lentilsoup",name:"Red lentil and tomato soup",serves:6,kcal:250,time:"35 min",tag:"Batch cook",
  ings:["250g red lentils","2 onions","3 carrots","2 cloves garlic","1 tin chopped tomatoes","2 stock cubes","1.5 litres water","1 tsp paprika","1 tbsp oil"],
  steps:["Peel and roughly chop the onions and carrots. Squash and chop the garlic.","Oil in a big pan on medium. Onions and carrots in, 8 minutes until the onion has gone soft and see-through. Stir now and then.","Garlic and paprika in, stir for 1 minute — don't let the garlic brown or it turns bitter.","Rinse the lentils in a sieve under the tap, then tip them in with the tomatoes, stock cubes and water.","Bring to the boil, then turn it right down and simmer 25 minutes with the lid half on.","The lentils will have collapsed into it. Blend smooth if you like, or leave it chunky. Salt and pepper to taste.","Cool, then portion into 6 tubs. Fridge 4 days, freezer 3 months."],
  note:"Pennies a portion and the most filling thing on this list. Make it on a Sunday."},
 {id:"chilli",name:"Batch chilli",serves:6,kcal:500,time:"45 min",tag:"Batch cook",
  ings:["500g 5% beef or turkey mince","2 onions","2 cloves garlic","2 tins chopped tomatoes","1 tin kidney beans","1 tin baked beans","2 tsp chilli powder","2 tsp paprika","1 tsp cumin","1 stock cube","300g rice (dry) to serve"],
  steps:["Chop the onions and garlic.","Big pan on medium-high, no oil needed for the mince. Break it up with a spoon and fry until there's no pink left, about 6 minutes.","Onions in, 5 minutes until soft. Then garlic and all the spices, stir for a minute.","Tomatoes, drained kidney beans, baked beans and the crumbled stock cube in. Swill half a tin of water out into the pan.","Bring to a bubble, turn it low, simmer 25 minutes with the lid off, stirring occasionally. It should thicken up properly.","Taste it. More chilli if it's flat, a pinch of salt if it needs lifting.","Rice: 50g dry each, boiled in plenty of salted water 10 to 12 minutes, drained.","Portion into 6 tubs. Three in the fridge, three in the freezer."],
  note:"The baked beans sound wrong and taste right — they thicken it and add sweetness for about 40p."},
 {id:"traybake",name:"Chicken and veg traybake",serves:4,kcal:450,time:"45 min",tag:"Dinner",
  ings:["8 chicken thighs, skin off (far cheaper than breast)","6 potatoes","3 carrots","2 onions","2 tbsp oil","2 tsp mixed herbs","1 tsp paprika","Salt and pepper"],

var KEY="kitchenTablePlan.v1";
var IS_FILE = (location.protocol === "file:");
var STORAGE_OK = (function(){
  try{
    if(!window.localStorage) return false;
    localStorage.setItem("__ktp_probe","1");
    var back = localStorage.getItem("__ktp_probe");
    localStorage.removeItem("__ktp_probe");
    return back === "1";
  }catch(e){ return false; }
})();

var state, tab="today", openAcc=null, openRec=null, flash="";
var logDate=null, searchTerm="", pending=null, showCustom=false, cfMode="per100";

function addEntry(name,kcal){
  var d=logDay();
  state.log[d]=state.log[d]||[];
  state.log[d].push({n:name,k:kcal});
  pending=null;searchTerm="";
  flash=save()?(kcal+" kcal added"):"Not saved — see the red note.";
  render();
}

function iso(d){d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function blank(){return{startDate:iso(),startLb:228,goalLb:154,weights:[],checks:{},
  log:{},customFoods:[],kcalTarget:1550};}

function load(){
  state=blank();
  if(!STORAGE_OK) return;
  try{var raw=localStorage.getItem(KEY); if(raw) state=Object.assign(blank(),JSON.parse(raw));}
  catch(e){ /* corrupt data, start clean rather than crash */ }
}
function save(){
  if(!STORAGE_OK) return false;
  try{ localStorage.setItem(KEY,JSON.stringify(state)); return true; }
  catch(e){ return false; }
}

function stoneStr(lb){var st=Math.floor(lb/14),r=Math.round(lb%14);
  if(r===14){st++;r=0;} return st+"st "+r+"lb";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function planFor(dateISO){
  var d=new Date(dateISO+"T12:00:00"), s=new Date(state.startDate+"T12:00:00");
  var wk=Math.max(1,Math.floor((d-s)/86400000/7)+1), ph=null, i;
  for(i=0;i<PHASES.length;i++){if(PHASES[i].weeks.indexOf(Math.min(wk,12))>-1){ph=PHASES[i];break;}}
  if(!ph)ph=PHASES[PHASES.length-1];
  var dow=d.getDay(), key=ph.days[dow];
  return {week:Math.min(wk,12),phase:ph,session:key?SESSIONS[key]:null,optional:!!ph.optional[dow]};
}
function current(){return state.weights.length?state.weights[state.weights.length-1].lb:state.startLb;}
function streak(){
  var n=0;
  for(var i=0;i<400;i++){
    var d=new Date(); d.setDate(d.getDate()-i);
    var c=state.checks[iso(d)], done=false, k;
    if(c){for(k in c){if(c[k]){done=true;break;}}}
    if(done)n++; else if(i>0)break;
  }
  return n;
}

       ' &middot; '+esc(row[3])+'<span class="muted"> &middot; '+esc(row[4])+'</span></div></div>';
  });
  h+='<p class="muted" style="margin-top:12px;font-size:13.5px">Notice how often leftovers appear. Cook once on Sunday, eat three times.</p></div>';

  h+='<div class="card"><div class="eyebrow">One shop</div><h2>Shopping list</h2><p class="muted">Covers the week above for two people. Own-brand everything.</p>';
  SHOPPING.forEach(function(sec){
    h+='<div style="border-top:1px solid var(--rule);padding-top:10px;margin-top:10px">'+
       '<div class="sched-day" style="margin-bottom:6px">'+sec[0]+'</div><ul>';
    sec[1].forEach(function(i){h+='<li>'+esc(i)+'</li>';});
    h+='</ul></div>';
  });
  h+='</div>';
  return h;
}

function chartSVG(){
  var pts=state.weights;
  if(pts.length<2)return '<p class="muted" style="padding:16px 0">Two weigh-ins and a line appears here. Same day each week, first thing in the morning, after the loo, before breakfast.</p>';
  var w=320,ht=150,pad=10;
  var lbs=pts.map(function(p){return p.lb;});
  var min=Math.min.apply(null,lbs.concat([state.goalLb]))-4, max=Math.max.apply(null,lbs)+4;
  var X=function(i){return pad+(i/(pts.length-1))*(w-pad*2);};
  var Y=function(v){return ht-pad-((v-min)/(max-min))*(ht-pad*2);};
  var d=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+","+Y(p.lb).toFixed(1);}).join(" ");
  var gy=Y(state.goalLb);
  var s='<svg viewBox="0 0 '+w+' '+ht+'" style="width:100%;height:auto;display:block" role="img" aria-label="Weight over time">';
  if(gy>pad&&gy<ht-pad){
    s+='<line x1="'+pad+'" y1="'+gy+'" x2="'+(w-pad)+'" y2="'+gy+'" stroke="#4F7A57" stroke-width="1" stroke-dasharray="3 4"/>'+
       '<text x="'+(w-pad)+'" y="'+(gy-5)+'" text-anchor="end" style="font-family:var(--mono);font-size:8px;fill:#4F7A57">goal</text>';
  }
  s+='<path d="'+d+'" fill="none" stroke="#35566B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){s+='<circle cx="'+X(i)+'" cy="'+Y(p.lb)+'" r="3" fill="#FBF7F0" stroke="#35566B" stroke-width="1.6"/>';});
  return s+'</svg>';
}

function viewProgress(){
  var cur=current(), h="";
  if(flash){h+='<div class="flash">'+esc(flash)+'</div>';flash="";}

  h+='<div class="card"><div class="eyebrow">Weigh-in</div><h2>Once a week, same day</h2>'+
    '<p class="muted">First thing in the morning, after the loo, before breakfast. Weighing daily will drive you mad — it swings three or four pounds on water alone.</p>'+
    '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:12px">'+
    '<label class="f"><div>STONE</div><input id="st" inputmode="numeric" placeholder="16"></label>'+
    '<label class="f"><div>POUNDS</div><input id="lb" inputmode="decimal" placeholder="4"></label>'+
    '<button class="btn" id="saveW">SAVE WEIGH-IN</button></div></div>';

  h+='<div class="card"><div class="eyebrow">The line</div><h3>Weight over time</h3>'+chartSVG();
  if(state.weights.length){
    h+='<div style="margin-top:14px;border-top:1px solid var(--rule);padding-top:10px">';
    state.weights.slice().reverse().slice(0,8).forEach(function(w){
      h+='<div class="weighrow"><span class="muted">'+
         new Date(w.date+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short"})+
         '</span><span>'+stoneStr(w.lb)+'</span></div>';
    });
    h+='</div>';
  }
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Half a stone at a time</div><h3>Milestones</h3>';
  var n=Math.max(1,Math.ceil((state.startLb-state.goalLb)/7)),i;
  for(i=0;i<n;i++){
    var t=state.startLb-(i+1)*7, hit=cur<=t;
    h+='<div class="mile'+(hit?" hit":"")+'"><span class="dot"></span><span>'+stoneStr(t)+
       '</span><span class="lb">&minus;'+((i+1)*7)+'lb</span></div>';
  }
  h+='<p class="muted" style="margin-top:12px;font-size:13.5px">Losing 5% of your starting weight already improves blood pressure, blood sugar and joint pain. That is the first milestone and a half, not the whole journey.</p></div>';

  h+='<div class="card"><div class="eyebrow">Put it on your home screen</div><h3>So it opens like an app</h3>'+
    '<p><strong>iPhone.</strong> In Safari, tap the share button at the bottom (a square with an arrow out of the top), scroll down, tap <em>Add to Home Screen</em>, then <em>Add</em>.</p>'+
    '<p><strong>Android.</strong> In Chrome, tap the three dots top right, then <em>Add to Home screen</em> or <em>Install app</em>.</p>'+
    '<p class="muted">Once it is on your home screen it opens instantly, works with no signal, and stops disappearing when the browser tidies up its tabs.</p></div>';

  h+='<div class="card"><div class="eyebrow">Setup</div><h3>Goal weight</h3>'+
    '<p class="muted">A healthy BMI at 5ft 5in runs from about 8st to 10st 10lb. That is a long way off and a poor first target. Aim at the next stone down and reset it when you get there.</p>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">'+
    '<button class="btn ghost small" id="goalUp">&minus;</button>'+
    '<span style="font-family:var(--mono);font-size:18px;font-weight:700;min-width:90px;text-align:center">'+stoneStr(state.goalLb)+'</span>'+
    '<button class="btn ghost small" id="goalDown">+</button>'+
    '<span class="muted" style="font-size:13px">adjust in half stones</span></div>'+
    '<div class="divide"></div><h3>Daily calorie target</h3>'+
    '<p class="muted">1,500 to 1,600 suits most people starting here. Do not push it below 1,200.</p>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">'+
    '<button class="btn ghost small" id="kcalDown">&minus;</button>'+
    '<span style="font-family:var(--mono);font-size:18px;font-weight:700;min-width:90px;text-align:center">'+state.kcalTarget+'</span>'+
    '<button class="btn ghost small" id="kcalUp">+</button>'+
    '<span class="muted" style="font-size:13px">50 at a time</span></div>'+
    '<div class="divide"></div><h3>Start date</h3>'+
    '<p class="muted">The plan counts your weeks from here. Change it if you want to restart.</p>'+
    '<input type="date" id="startDate" value="'+state.startDate+'" style="font-family:var(--body);font-size:15px">'+
    '<div class="divide"></div><h3>Back up and restore</h3>'+
    '<p class="muted">Everything lives on this phone only. Clearing your browsing data wipes it. Copy a backup now and then and text it to yourself.</p>'+
    '<div class="btnrow"><button class="btn ghost small" id="backup">COPY MY DATA</button>'+
    '<button class="btn ghost small" id="restore">RESTORE FROM BACKUP</button></div></div>';
  return h;
}

/* ---------- calorie log ---------- */

function logDay(){ return logDate || iso(); }
function entries(d){ return state.log[d||logDay()] || []; }
function dayTotal(d){ return entries(d).reduce(function(a,e){return a+e.k;},0); }

function avg7(){
  var sum=0,n=0,i;
  for(i=0;i<7;i++){
    var dt=new Date(); dt.setDate(dt.getDate()-i);
    var k=iso(dt);
    if(state.log[k]&&state.log[k].length){sum+=dayTotal(k);n++;}
  }
  return n?Math.round(sum/n):0;
}

function allFoods(){
  var out=[],i;
  for(i=0;i<state.customFoods.length;i++) out.push({key:"own-"+i,f:state.customFoods[i],own:true});
  for(i=0;i<FOODDB.length;i++) out.push({key:"db-"+i,f:FOODDB[i],own:false});
  return out;
}
function foodByKey(k){
  var p=k.split("-"), i=parseInt(p[1],10);
  return p[0]==="own" ? state.customFoods[i] : FOODDB[i];
}

function amountRow(f){
  var per = f.per100 !== undefined;
  var chips = per ? [50,100,150,200] : [1,2,3];
  var h='<div class="amt"><div class="amt-lbl">'+(per?"How many grams?":"How many?")+'</div>'+
    '<div class="amt-row"><input id="amtIn" inputmode="decimal" value="'+(per?100:1)+'">'+
    '<button class="btn small" id="amtAdd">ADD</button></div><div class="chips">';
  chips.forEach(function(c){ h+='<button class="chip" data-chip="'+c+'">'+c+(per?"g":"")+'</button>'; });
  h+='</div><div class="amt-lbl muted" style="margin-top:8px">'+
     (per? f.per100+" kcal per 100g" : f.each+" kcal each")+'</div></div>';
  return h;
}

function resultsHTML(){
  var q=searchTerm.trim().toLowerCase(), list=allFoods(), h="";
  if(q) list=list.filter(function(x){return x.f.n.toLowerCase().indexOf(q)>-1;});
  else list=list.filter(function(x){return x.own;});

  if(!q && !list.length)
    return '<p class="muted" style="font-size:14px;margin:10px 0 0">Start typing to find a food — porridge, mince, banana, biscuit. Anything you save yourself appears here first next time.</p>';
  if(q && !list.length)
    return '<p class="muted" style="font-size:14px;margin:10px 0 0">Nothing matching. Use <strong>Add your own food</strong> below and it will be here from now on.</p>';

  list.slice(0,14).forEach(function(x){
    var open=(pending===x.key);
    h+='<div class="fitem"><button data-food="'+x.key+'"><span class="fname">'+esc(x.f.n)+
       (x.own?' <span class="own">yours</span>':'')+'</span><span class="fkcal">'+
       (x.f.per100!==undefined ? x.f.per100+"/100g" : x.f.each+" ea")+'</span></button>';
    if(open) h+=amountRow(x.f);
    h+='</div>';
  });
  if(list.length>14) h+='<p class="muted" style="font-size:13px;margin:8px 0 0">Keep typing to narrow it down.</p>';
  return h;
}

function viewLog(){
  var d=logDay(), t=dayTotal(d), target=state.kcalTarget, left=target-t;
  var pct=Math.max(0,Math.min(100,Math.round((t/target)*100)));
  var isToday=(d===iso()), h="";
  if(flash){h+='<div class="flash">'+esc(flash)+'</div>';flash="";}

  h+='<div class="card"><div class="daybar">'+
     '<button class="step" data-day="-1">&#8249;</button>'+
     '<span class="daylbl">'+(isToday?"Today":new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}))+'</span>'+
     '<button class="step" data-day="1"'+(isToday?' disabled':'')+'>&#8250;</button></div>';
  h+='<div class="big">'+t+'<span class="of"> of '+target+' kcal</span></div>';
  h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="leftline">'+(left>=0
      ? left+' left today'
      : Math.abs(left)+' over — that is information, not a verdict')+'</div>';
  if(avg7()) h+='<div class="muted" style="font-size:13px;margin-top:6px">7-day average: '+avg7()+' kcal a day</div>';
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Add something</div><h3>Search</h3>'+
     '<input id="foodSearch" placeholder="porridge, mince, banana..." value="'+esc(searchTerm)+'" autocomplete="off">'+
     '<div id="results">'+resultsHTML()+'</div>';

  h+='<div class="divide"></div><div class="eyebrow">Or your own recipe</div>'+
     '<p class="muted" style="font-size:13.5px">One tap logs a full portion.</p><div class="quick">';
  RECIPES.forEach(function(r){
    h+='<button class="chip" data-recipe="'+r.id+'">'+esc(r.name)+' <b>'+r.kcal+'</b></button>';
  });
  h+='</div>';

  h+='<div class="divide"></div>';
  if(!showCustom){
    h+='<button class="btn ghost small" id="showCustom">ADD YOUR OWN FOOD</button>';
  }else{
    h+='<div class="eyebrow">New food</div><h3>Save it once, use it forever</h3>'+
       '<p class="muted" style="font-size:13.5px">Copy the numbers straight off the packet. Pick whichever the label gives you.</p>'+
       '<label class="f" style="display:block;margin-bottom:8px"><div>NAME</div>'+
       '<input id="cfName" placeholder="Aldi chicken kiev" style="font-family:var(--body)"></label>'+
       '<label class="f" style="display:block;margin-bottom:8px"><div>CALORIES</div>'+
       '<input id="cfKcal" inputmode="numeric" placeholder="285"></label>'+
       '<div class="chips" style="margin-bottom:10px">'+
       '<button class="chip sel" data-cfmode="per100" id="mPer">per 100g</button>'+
       '<button class="chip" data-cfmode="each" id="mEach">per item</button></div>'+
       '<div class="btnrow"><button class="btn small" id="cfSave">SAVE FOOD</button>'+
       '<button class="btn ghost small" id="cfCancel">CANCEL</button></div>';
  }
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Eaten</div><h3>'+(isToday?"Today":"That day")+'</h3>';
  var es=entries(d);
  if(!es.length){
    h+='<p class="muted">Nothing logged yet. Rough is fine — a rough log you keep beats a perfect one you abandon after four days.</p>';
  }else{
    es.forEach(function(e,i){
      h+='<div class="logrow"><span class="lname">'+esc(e.n)+'</span>'+
         '<span class="lk">'+e.k+'</span>'+
         '<button class="del" data-del="'+i+'" aria-label="Remove">&times;</button></div>';
    });
  }
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Worth knowing</div><h3>How to count without it taking over</h3>'+
    '<p>Weigh the things that carry most of the calories — oil, cheese, butter, pasta, rice, meat. Eyeball the veg. Nobody has ever got fat misjudging a carrot.</p>'+
    '<p>Log it as you cook, not at bedtime. You will not remember by then and you will guess low, everybody does.</p>'+
    '<p><strong>Do not chase a low number.</strong> Under 1,200 a day is not a shortcut — it is how you end up exhausted, ravenous and quitting in week three. If a day comes in very low, eat something.</p>'+
    '<p class="muted">Going over on a Saturday changes almost nothing across a week. The 7-day average above is the number that actually matters.</p></div>';
  return h;
}

function render(){
  var p=planFor(iso()), st=streak();
  document.getElementById("weeklabel").textContent="WEEK "+String(p.week).padStart(2,"0")+" OF 12";
  document.getElementById("phaselabel").textContent=
    p.phase.name+" \u00b7 "+(st>0?st+" day"+(st===1?"":"s")+" on the trot":"Start today");

  var t=[["today","Today"],["move","Move"],["food","Food"],["log","Log"],["progress","Progress"]];
  document.getElementById("tabs").innerHTML=t.map(function(x){
    return '<button data-tab="'+x[0]+'" aria-current="'+(tab===x[0])+'">'+x[1]+'</button>';
  }).join("");

  var body = tab==="today"?viewToday(): tab==="move"?viewMove(): tab==="food"?viewFood():
             tab==="log"?viewLog(): viewProgress();
  document.getElementById("view").innerHTML = storageBanner() + body;
  window.scrollTo(0,0);
}

/* ============================ EVENTS ============================ */

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-habit],[data-acc],[data-rec],#saveW,#goalUp,#goalDown,#backup,#restore");
  if(!el)return;

  if(el.dataset.tab){tab=el.dataset.tab;openAcc=null;openRec=null;pending=null;render();return;}

  if(el.dataset.day){
    var dd=new Date(logDay()+"T12:00:00");
    dd.setDate(dd.getDate()+parseInt(el.dataset.day,10));
    if(iso(dd)>iso())return;
    logDate=iso(dd);pending=null;render();return;
  }
  if(el.dataset.food){
    pending=(pending===el.dataset.food)?null:el.dataset.food;
    document.getElementById("results").innerHTML=resultsHTML();
    var ai=document.getElementById("amtIn"); if(ai){ai.focus();ai.select();}
    return;
  }
  if(el.dataset.chip){
    var ci=document.getElementById("amtIn"); if(ci)ci.value=el.dataset.chip;
    return;
  }
  if(el.id==="amtAdd"){
    var f=foodByKey(pending), amt=parseFloat(document.getElementById("amtIn").value);
    if(!f||!(amt>0)){alert("Put a number in first.");return;}
    var kcal = f.per100!==undefined ? Math.round(f.per100*amt/100) : Math.round(f.each*amt);
    var nm = f.per100!==undefined ? f.n+" ("+amt+"g)" : (amt===1? f.n : f.n+" x"+amt);
    addEntry(nm,kcal);return;
  }
  if(el.dataset.recipe){
    var r=null,z; for(z=0;z<RECIPES.length;z++){if(RECIPES[z].id===el.dataset.recipe)r=RECIPES[z];}
    if(r)addEntry(r.name+" (1 portion)",r.kcal);
    return;
  }
  if(el.dataset.del!==undefined){
    var dk=logDay(); state.log[dk].splice(parseInt(el.dataset.del,10),1);
    if(!state.log[dk].length)delete state.log[dk];
    save();render();return;
  }
  if(el.id==="showCustom"){showCustom=true;render();return;}
  if(el.id==="cfCancel"){showCustom=false;render();return;}
  if(el.dataset.cfmode){
    cfMode=el.dataset.cfmode;
    document.getElementById("mPer").className="chip"+(cfMode==="per100"?" sel":"");
    document.getElementById("mEach").className="chip"+(cfMode==="each"?" sel":"");
    return;
  }
  if(el.id==="cfSave"){
    var nname=document.getElementById("cfName").value.trim();
    var nk=parseFloat(document.getElementById("cfKcal").value);
    if(!nname||!(nk>0)){alert("Needs a name and a calorie number.");return;}
    var obj={n:nname};
    if(cfMode==="each")obj.each=Math.round(nk); else obj.per100=Math.round(nk);
    state.customFoods.unshift(obj);
    showCustom=false;searchTerm=nname;pending=null;
    flash=save()?("Saved "+nname+" — search for it any time."):"Not saved — see the red note.";
    render();return;
  }
  if(el.id==="kcalUp"){state.kcalTarget=Math.min(3000,state.kcalTarget+50);save();render();return;}
  if(el.id==="kcalDown"){state.kcalTarget=Math.max(1200,state.kcalTarget-50);save();render();return;}

  if(el.dataset.habit){
    var d=iso(); state.checks[d]=state.checks[d]||{};
    state.checks[d][el.dataset.habit]=!state.checks[d][el.dataset.habit];
    save();render();return;
  }
  if(el.dataset.acc){openAcc=(openAcc===el.dataset.acc)?null:el.dataset.acc;render();return;}
  if(el.dataset.rec){openRec=(openRec===el.dataset.rec)?null:el.dataset.rec;render();return;}

  if(el.id==="saveW"){
    var st=parseInt(document.getElementById("st").value,10)||0;
    var lb=parseFloat(document.getElementById("lb").value)||0;
    var total=st*14+lb;
    if(total<60||total>500){alert("That doesn't look right — check the stone and pounds boxes.");return;}
    var d2=iso();
    state.weights=state.weights.filter(function(w){return w.date!==d2;});
    if(!state.weights.length)state.startLb=total;
    state.weights.push({date:d2,lb:total});
    state.weights.sort(function(a,b){return a.date<b.date?-1:1;});
    flash = save() ? "Saved: "+stoneStr(total) : "Not saved — see the red note above.";
    render();return;
  }
  if(el.id==="goalUp"){state.goalLb=Math.min(state.startLb-7,state.goalLb+7);save();render();return;}
  if(el.id==="goalDown"){state.goalLb=Math.max(112,state.goalLb-7);save();render();return;}

  if(el.id==="backup"){
    var txt=JSON.stringify(state);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(
        function(){alert("Copied. Paste it into a note or text it to yourself.");},
        function(){prompt("Copy this and keep it safe:",txt);});
    }else{prompt("Copy this and keep it safe:",txt);}
    return;
  }
  if(el.id==="restore"){
    var paste=prompt("Paste your backup here. This replaces everything currently saved.");
    if(!paste)return;
    try{
      var obj=JSON.parse(paste);
      if(!obj||typeof obj!=="object"||!("weights" in obj))throw new Error("bad");
      state=Object.assign(blank(),obj);
      flash = save() ? "Backup restored." : "Restored for now, but it can't be saved — see the red note.";
      tab="progress";render();
    }catch(err){alert("That doesn't look like a backup. Paste the whole thing, including the curly brackets.");}
    return;
  }
});

document.addEventListener("input",function(e){
  if(e.target.id==="foodSearch"){
    searchTerm=e.target.value; pending=null;
    var r=document.getElementById("results"); if(r)r.innerHTML=resultsHTML();
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="amtIn"){e.preventDefault();
    var b=document.getElementById("amtAdd"); if(b)b.click();}
});

document.addEventListener("change",function(e){
  if(e.target.id==="startDate"&&e.target.value){state.startDate=e.target.value;save();render();}
});

/* Offline support. Only works over http(s), which is the point. */
if("serviceWorker" in navigator && !IS_FILE){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

load();render();
</script>
