<html lang="en-GB">

<title>Calorie Counter — The Kitchen Table Plan</title>

<style>
:root{
  --ink:#22303A; --soft:#5B6B75; --card:#FBF7F0; --edge:#E8DFD1;
  --rule:#CBDDE6; --tin:#35566B; --red:#C4483C; --ochre:#D9A441; --green:#4F7A57;
  --display:"Zilla Slab", Georgia, "Iowan Old Style", serif;
  --body:"Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Space Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--tin);font-family:var(--body);color:var(--ink);
  -webkit-text-size-adjust:100%;padding-bottom:calc(56px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{padding:calc(26px + env(safe-area-inset-top)) 6px 16px}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:rgba(255,255,255,.6);text-transform:uppercase}
h1{font-family:var(--display);font-size:32px;font-weight:700;color:#fff;margin:6px 0 4px;line-height:1.05}
.sub{font-family:var(--body);font-size:14px;color:rgba(255,255,255,.72);margin:0}
a.back{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:rgba(255,255,255,.85);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:2px}

.card{background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 0 rgba(0,0,0,.05)}
.card h2{font-family:var(--display);font-size:20px;margin:0 0 10px;font-weight:600}
.card h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);
  margin:0 0 8px;font-weight:400}
.muted{color:var(--soft)}
.small{font-size:14px;line-height:1.55}
.tiny{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--soft)}

.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.rowsplit{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.track{height:12px;background:#EFE7DA;border:1px solid var(--edge);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.track > i{display:block;height:100%;background:var(--green);transition:width .35s}
.track.over > i{background:var(--red)}
.legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--soft)}

.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daynav button{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--edge);
  border-radius:6px;padding:8px 12px;color:var(--ink)}
.daynav button[disabled]{opacity:.35}
.daynav .lbl{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.85);letter-spacing:.08em}

button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:6px;background:var(--tin);
  color:#fff;border:1px solid var(--tin);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--tin)}
.btn.red{background:var(--red);border-color:var(--red)}

input,select{width:100%;padding:11px;border:1px solid var(--edge);border-radius:6px;background:#fff;
  font-family:var(--body);font-size:16px;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--rule);box-shadow:0 0 0 3px rgba(203,221,230,.5)}
.field{margin-bottom:10px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--soft);margin-bottom:5px}
.pair{display:flex;gap:8px}
.pair .field{flex:1;margin-bottom:0}

.result{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:11px 12px;border:1px solid var(--edge);border-radius:6px;background:#fff;margin-bottom:6px}
.result .n{font-size:15px;line-height:1.3}
.result .u{display:block;font-family:var(--mono);font-size:10px;color:var(--soft);margin-top:2px}
.result .k{font-family:var(--mono);font-size:13px;color:var(--tin);white-space:nowrap}

.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--edge)}
.item:last-child{border-bottom:none}
.item .n{flex:1;font-size:15px;line-height:1.3}
.item .n em{display:block;font-family:var(--mono);font-size:10px;color:var(--soft);font-style:normal;margin-top:2px}
.item .k{font-family:var(--mono);font-size:14px;min-width:52px;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border:1px solid var(--edge);border-radius:6px;background:#fff;
  text-align:center;font-family:var(--mono);font-size:14px;line-height:26px}
.qty span{font-family:var(--mono);font-size:13px;min-width:16px;text-align:center}
.del{color:var(--red);font-family:var(--mono);font-size:16px;padding:0 4px}

.hist{display:flex;align-items:center;gap:10px;padding:7px 0}
.hist .d{font-family:var(--mono);font-size:11px;color:var(--soft);width:74px}
.hist .b{flex:1;height:8px;background:#EFE7DA;border-radius:99px;overflow:hidden}
.hist .b > i{display:block;height:100%;background:var(--green)}
.hist .b.over > i{background:var(--red)}
.hist .v{font-family:var(--mono);font-size:12px;width:52px;text-align:right}

.banner{border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.banner.warn{background:#FBEAE7;border:1px solid var(--red);color:#7A2A22}
.banner.ok{background:#EAF1EB;border:1px solid var(--green);color:#2F4F36}
.banner b{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;display:block;margin-bottom:4px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--edge);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;padding:14px 4px;text-align:center;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--soft);border-top:2px solid transparent}
nav button.on{color:var(--tin);border-top-color:var(--tin);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  <div class="kicker">The Kitchen Table Plan</div>
  <h1>Calorie Counter</h1>
  <p class="sub">For the days you cook your own thing.</p>

</header>
<div class="wrap" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<script>

/* ---------------------------- state ---------------------------- */

function iso(d){ d=d||new Date(); var x=new Date(d.getTime()-d.getTimezoneOffset()*60000); return x.toISOString().slice(0,10); }
function today(){ return iso(); }
function defaults(){ return {target:1500, days:{}}; }

var S, storageOk=false;
try{ var raw=localStorage.getItem(KEY); S = raw ? Object.assign(defaults(), JSON.parse(raw)) : defaults(); }
catch(e){ S = defaults(); }
try{ localStorage.setItem(KEY+"_test","1"); localStorage.removeItem(KEY+"_test"); storageOk=true; }catch(e){ storageOk=false; }

var isFile = (location.protocol === "file:");
var ui = {tab:"today", day:today(), q:"", cat:"", msg:null, msgKind:"ok"};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* --------------------------- helpers --------------------------- */

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function entries(d){ return S.days[d] || []; }
function totalFor(d){ var t=0; entries(d).forEach(function(e){ t += e.k*e.q; }); return Math.round(t); }
function proteinFor(d){ var t=0; entries(d).forEach(function(e){ t += (e.p||0)*e.q; }); return Math.round(t); }
function shiftDay(d, n){ var x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return iso(x); }
function niceDay(d){
  if(d===today()) return "Today";
  if(d===shiftDay(today(),-1)) return "Yesterday";
  var x=new Date(d+"T12:00:00");
  return x.toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short"});
}
function allFoods(){
  var out=[];
  Object.keys(FOODS).forEach(function(cat){
    FOODS[cat].forEach(function(f){ out.push({cat:cat, n:f[0], u:f[1], k:f[2], p:f[3]}); });
  });
  return out;
}

/* ---------------------------- views ---------------------------- */

function banner(){
  var h="";
  if(isFile){
    h += '<div class="banner warn"><b>Opened as a file</b>Nothing you add here will save. This page needs to sit on the same web address as the rest of the plan.</div>';
  } else if(!storageOk){
    h += '<div class="banner warn"><b>Not saving</b>The browser is blocking storage — usually private browsing. Open it in a normal window.</div>';
  }
  if(ui.msg) h += '<div class="banner '+(ui.msgKind==="warn"?"warn":"ok")+'">'+esc(ui.msg)+'</div>';
  return h;
}

function viewToday(){
  var d=ui.day, tot=totalFor(d), left=S.target-tot, pct=(tot/S.target)*100;
  var over = tot > S.target;
  var h = banner();

  h += '<div class="daynav">'+
    '<button data-act="day" data-n="-1">&larr; Previous</button>'+
    '<span class="lbl">'+esc(niceDay(d))+'</span>'+
    '<button data-act="day" data-n="1"'+(d===today()?" disabled":"")+'>Next &rarr;</button></div>';

  h += '<div class="card"><div class="rowsplit"><div>'+
      '<h3>Eaten</h3><div class="big">'+tot+'</div></div>'+
      '<div style="text-align:right"><h3>'+(over?"Over by":"Left")+'</h3>'+
      '<div class="big" style="color:'+(over?"var(--red)":"var(--green)")+'">'+Math.abs(left)+'</div></div></div>'+
    '<div class="track'+(over?" over":"")+'"><i style="width:'+Math.min(100,Math.max(0,pct))+'%"></i></div>'+
    '<div class="legend"><span>Target '+S.target+' kcal</span><span>'+proteinFor(d)+' g protein</span></div></div>';

  var list = entries(d);
  var lb = "";
  if(!list.length){
    lb = '<p class="small muted" style="margin:0">Nothing added yet. Search the list below, or add your own.</p>';
  } else {
    list.forEach(function(e,i){
      lb += '<div class="item"><span class="n">'+esc(e.n)+'<em>'+esc(e.u||"")+'</em></span>'+
        '<span class="qty"><button data-act="less" data-i="'+i+'">&minus;</button>'+
        '<span>'+e.q+'</span><button data-act="more" data-i="'+i+'">+</button></span>'+
        '<span class="k">'+Math.round(e.k*e.q)+'</span>'+
        '<button class="del" data-act="del" data-i="'+i+'">&times;</button></div>';
    });
  }
  h += '<div class="card"><h2>'+esc(niceDay(d))+'</h2>'+lb+'</div>';

  h += '<div class="card"><h2>Add something</h2>'+
    '<div class="field"><label>Search</label><input id="q" value="'+esc(ui.q)+'" placeholder="chicken, toast, wine..."></div>';

  var q = ui.q.trim().toLowerCase();
  if(q.length >= 2){
    var hits = allFoods().filter(function(f){ return f.n.toLowerCase().indexOf(q) > -1; }).slice(0,14);
    if(!hits.length){
      h += '<p class="small muted">Nothing matching. Add it by hand below and it stays for next time.</p>';
    } else {
      hits.forEach(function(f){
        h += '<button class="result" data-act="add" data-n="'+esc(f.n)+'" data-u="'+esc(f.u)+'" data-k="'+f.k+'" data-p="'+f.p+'">'+
          '<span class="n">'+esc(f.n)+'<span class="u">'+esc(f.u)+' &middot; '+esc(f.cat)+'</span></span>'+
          '<span class="k">'+f.k+' kcal</span></button>';
      });
    }
  } else {
    h += '<h3 style="margin-top:14px">Straight from the plan</h3>';
    FOODS["From the plan"].forEach(function(f){
      h += '<button class="result" data-act="add" data-n="'+esc(f[0])+'" data-u="'+esc(f[1])+'" data-k="'+f[2]+'" data-p="'+f[3]+'">'+
        '<span class="n">'+esc(f[0])+'<span class="u">'+esc(f[1])+'</span></span>'+
        '<span class="k">'+f[2]+' kcal</span></button>';
    });
    h += '<p class="tiny" style="margin-top:10px">Type two letters to search everything else — around a hundred everyday foods.</p>';
  }

  h += '<h3 style="margin-top:16px">Or add your own</h3>'+
    '<div class="field"><label>What was it</label><input id="cn" placeholder="Mum\u2019s lasagne"></div>'+
    '<div class="pair"><div class="field"><label>Calories</label><input id="ck" inputmode="numeric" placeholder="450"></div>'+
    '<div class="field"><label>Protein (g, optional)</label><input id="cp" inputmode="numeric" placeholder="25"></div></div>'+
    '<button class="btn" data-act="custom" style="margin-top:10px">Add it</button>'+
    '<p class="tiny" style="margin-top:8px">Packet calories are on the back, per portion. If you\u2019re guessing, guess high \u2014 it\u2019s the honest direction.</p></div>';

  return h;
}

function viewHistory(){
  var h = banner();
  var days=[], d=today();
  for(var i=0;i<14;i++){ days.push(d); d=shiftDay(d,-1); }
  var logged = days.filter(function(x){ return entries(x).length; });

  var avg = 0;
  if(logged.length){ logged.forEach(function(x){ avg += totalFor(x); }); avg = Math.round(avg/logged.length); }

  h += '<div class="card"><h2>Last fortnight</h2>';
  if(!logged.length){
    h += '<p class="small muted" style="margin:0">Nothing logged yet. It fills in as you go.</p>';
  } else {
    h += '<div class="rowsplit" style="margin-bottom:12px"><div><h3>Daily average</h3><div class="big">'+avg+'</div></div>'+
      '<div style="text-align:right"><h3>Days logged</h3><div class="big">'+logged.length+'</div></div></div>';
    days.forEach(function(x){
      var t=totalFor(x), pct=Math.min(100,(t/S.target)*100), over=t>S.target;
      h += '<div class="hist"><span class="d">'+esc(niceDay(x))+'</span>'+
        '<span class="b'+(over?" over":"")+'"><i style="width:'+(t?pct:0)+'%"></i></span>'+
        '<span class="v">'+(t?t:"\u2014")+'</span></div>';
    });
    h += '<p class="tiny" style="margin-top:12px">One heavy day inside a good week barely moves the needle. It\u2019s the fortnight\u2019s average that shows up on the scales.</p>';
  }
  h += '</div>';
  return h;
}

function viewSettings(){
  var h = banner();
  h += '<div class="card"><h2>Your daily target</h2>'+
    '<div class="field"><label>Calories a day</label><input id="tg" inputmode="numeric" value="'+S.target+'"></div>'+
    '<button class="btn" data-act="target">Save target</button>'+
    '<p class="small muted" style="margin:10px 0 0">The plan works to about 1,500 a day. Under 1,200 isn\u2019t a faster route \u2014 it just makes you tired, hungry and more likely to pack it in, so the box won\u2019t go below that.</p></div>';

  h += '<div class="card"><h2>Your data</h2>'+
    '<p class="small muted" style="margin:0 0 12px">Everything stays on this phone. Nothing is sent anywhere. This counter keeps its own store, separate from the rest of the plan.</p>'+
    '<button class="btn ghost" data-act="backup">Copy backup code</button>'+
    '<div class="field" style="margin-top:12px"><label>Restore from a code</label><input id="rc" placeholder="Paste it here"></div>'+
    '<button class="btn ghost" data-act="restore">Restore</button>'+
    '<p class="tiny" style="margin-top:10px">Worth copying monthly. Restoring replaces everything currently in the counter.</p></div>';

  h += '<div class="card"><h2>Clear a day</h2>'+
    '<p class="small muted" style="margin:0 0 12px">Wipes everything logged for '+esc(niceDay(ui.day))+'.</p>'+
    '<button class="btn red" data-act="clearday">Clear '+esc(niceDay(ui.day))+'</button></div>';
  return h;
}

var TABS=[["today","Today"],["history","History"],["settings","Settings"]];

function render(){
  var y=window.scrollY;
  var h = ui.tab==="today" ? viewToday() : ui.tab==="history" ? viewHistory() : viewSettings();
  document.getElementById("app").innerHTML = h;
  var nav="";
  TABS.forEach(function(t){ nav += '<button data-act="tab" data-id="'+t[0]+'" class="'+(ui.tab===t[0]?"on":"")+'">'+t[1]+'</button>'; });
  document.getElementById("nav").innerHTML = nav;
  var qEl=document.getElementById("q");
  if(qEl && ui.focusQ){ qEl.focus(); qEl.setSelectionRange(qEl.value.length, qEl.value.length); }
  window.scrollTo(0,y);
}

/* --------------------------- actions --------------------------- */

function addEntry(n,u,k,p){
  var d=ui.day, list=entries(d).slice();
  var found=-1;
  list.forEach(function(e,i){ if(e.n===n && e.k===k) found=i; });
  if(found>-1) list[found] = Object.assign({}, list[found], {q:list[found].q+1});
  else list.push({n:n,u:u,k:k,p:p,q:1});
  S.days[d]=list; save(); render();
}

function bump(i,n){
  var d=ui.day, list=entries(d).slice();
  if(!list[i]) return;
  list[i] = Object.assign({}, list[i], {q:list[i].q+n});
  if(list[i].q<=0) list.splice(i,1);
  S.days[d]=list; save(); render();
}

function customAdd(){
  var n=(document.getElementById("cn")||{}).value||"";
  var k=parseFloat((document.getElementById("ck")||{}).value);
  var p=parseFloat((document.getElementById("cp")||{}).value);
  n=n.trim();
  if(!n || isNaN(k) || k<0){ ui.msg="Give it a name and a calorie number, then tap Add it."; ui.msgKind="warn"; render(); return; }
  ui.msg=null; addEntry(n, "your entry", Math.round(k), isNaN(p)?0:Math.round(p));
}

function setTarget(){
  var v=parseInt((document.getElementById("tg")||{}).value,10);
  if(isNaN(v)){ ui.msg="Enter a number of calories."; ui.msgKind="warn"; render(); return; }
  if(v<1200){ v=1200; ui.msg="Set to 1,200 \u2014 that\u2019s the floor this counter allows."; ui.msgKind="warn"; }
  else { ui.msg="Target saved."; ui.msgKind="ok"; }
  S.target=v; save(); render();
}

function backup(){
  var code=JSON.stringify(S);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(function(){
      ui.msg="Backup code copied. Paste it into a note to yourself."; ui.msgKind="ok"; render();
    }, function(){ window.prompt("Copy this and keep it safe:", code); });
  } else { window.prompt("Copy this and keep it safe:", code); }
}

function restore(){
  var v=((document.getElementById("rc")||{}).value||"").trim();
  if(!v){ ui.msg="Paste your backup code into the box first."; ui.msgKind="warn"; render(); return; }
  var o=null;
  try{ o=JSON.parse(v); }catch(e){ o=null; }
  if(!o || typeof o!=="object" || typeof o.days!=="object"){
    ui.msg="That code didn\u2019t look right \u2014 paste the whole thing, from the first { to the last }.";
    ui.msgKind="warn"; render(); return;
  }
  S=Object.assign(defaults(), o); save();
  ui.msg="Restored."; ui.msgKind="ok"; render();
}

document.addEventListener("input", function(e){
  if(e.target && e.target.id==="q"){ ui.q=e.target.value; ui.focusQ=true; render(); ui.focusQ=false; }
});

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-act]") : null;
  if(!t) return;
  var a=t.getAttribute("data-act");
  if(a==="tab"){ ui.tab=t.getAttribute("data-id"); ui.msg=null; window.scrollTo(0,0); render(); }
  else if(a==="day"){
    var n=parseInt(t.getAttribute("data-n"),10);
    var next=shiftDay(ui.day,n);
    if(next>today()) return;
    ui.day=next; ui.msg=null; render();
  }
  else if(a==="add"){ addEntry(t.getAttribute("data-n"), t.getAttribute("data-u"), parseFloat(t.getAttribute("data-k")), parseFloat(t.getAttribute("data-p"))); }
  else if(a==="more"){ bump(parseInt(t.getAttribute("data-i"),10), 1); }
  else if(a==="less"){ bump(parseInt(t.getAttribute("data-i"),10), -1); }
  else if(a==="del"){ bump(parseInt(t.getAttribute("data-i"),10), -999); }
  else if(a==="custom"){ customAdd(); }
  else if(a==="target"){ setTarget(); }
  else if(a==="backup"){ backup(); }
  else if(a==="restore"){ restore(); }
  else if(a==="clearday"){ delete S.days[ui.day]; save(); ui.msg="Cleared."; ui.msgKind="ok"; render(); }
});

render();

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
